name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/check_all.py
      - name: Release bundle dry run (docs/distribution-spec.md section 4)
        run: python3 scripts/bundle/build_bundle.py --check
      - name: Keep the built bundle for the PowerShell verifier
        run: python3 scripts/bundle/build_bundle.py --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: out/bundle/
          retention-days: 3

  # The PowerShell verifier on the shared fixtures and the built bundle: Windows PowerShell 5.1 and
  # PowerShell 7, as consumers run it.
  bundle-powershell:
    needs: method
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: built
      - name: Pester
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          $env:AVD_ASSESS_BUNDLE = (Resolve-Path ./built).Path
          $c = New-PesterConfiguration
          $c.Run.Path = './tests/AvdAssessBundle.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
