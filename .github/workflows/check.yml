name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/build_index.py --check
      - run: python3 tests/check_method.py
      - run: python3 tests/check_contracts.py
      - run: python3 tests/check_dimensions.py
      - run: python3 tests/check_baselines.py
      - run: python3 tests/check_use_cases.py
      - run: python3 scripts/check_evidence.py
      - run: python3 tests/check_evidence_fixtures.py
      - run: python3 tests/check_endpoints.py
      - run: python3 tests/check_wording.py
