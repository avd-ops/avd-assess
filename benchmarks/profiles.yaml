# The two-tier AVD benchmark profile catalog (gap:workload-benchmark, gap:baseline-profile).
# Tier 1 (synthetic) profiles are executed by avd-benchmark against a lab host pool or an ephemeral
# sandbox batch; Tier 2 (observational) profiles are exported read-only by avd-current-state from a
# 7-to-30-day Log Analytics window. Every run emits a Contract C25 (avd-benchmark-result/v1) file
# checked by scripts/check_evidence.py.
schema: avd-assess-benchmarks/v1

profiles:
  - id: storage-fslogix-io
    version: 1.0.0
    tier: synthetic
    title: Profile share and OS disk I/O micro-benchmark
    summary: Measures local OS disk and FSLogix profile share IOPS, throughput and latency (p50/p95/p99) for VHDX attach, sequential logon read and steady-state 4K random read/write.
    harness: Microsoft diskspd (MIT, pinned release) plus PowerShell VHDX mount timer
    parameters:
      - name: blockSizeKiB
        value: 4
        unit: kib
      - name: durationSeconds
        value: 120
        unit: s
      - name: readWriteRatio
        value: 70/30
        unit: ratio
    metrics:
      - metric: readIops
        unit: iops
      - metric: writeIops
        unit: iops
      - metric: readLatencyMs
        unit: ms
      - metric: writeLatencyMs
        unit: ms
      - metric: vhdxAttachMs
        unit: ms
    claims:
      - ref:avd-deploy-host-pool#premium-ssd-os-disk
      - ref:disk-encryption-options#encryption-at-host
      - ref:review-checklists-avd#H03.05
      - ref:fslogix-storage-options#iops-per-user
      - gap:workload-benchmark
      - gap:baseline-profile
    observations:
      - obs:premium-ssd-os-disk-default
      - obs:encryption-at-host-by-default
      - obs:smb-channel-aes128-gcm-needed

  - id: host-logon-storm
    version: 1.0.0
    tier: synthetic
    title: Concurrent session sign-in storm benchmark
    summary: Measures staggered or concurrent session sign-in duration broken down by stage (broker, transport, Entra Kerberos auth, FSLogix profile attach, policy evaluation and shell ready) alongside host CPU and memory spikes.
    harness: PowerShell session orchestrator plus TerminalServices and FSLogix Operational event logs and WVDConnections
    parameters:
      - name: concurrentSessions
        value: 16
        unit: sessions
      - name: staggerSeconds
        value: 5
        unit: s
    metrics:
      - metric: timeToConnectMs
        unit: ms
      - metric: profileLoadMs
        unit: ms
      - metric: vhdxAttachMs
        unit: ms
      - metric: cpuPct
        unit: percent
      - metric: availableMemoryMiB
        unit: mib
    claims:
      - ref:defender-av-vdi#cache-maintenance-before-seal
      - ref:fslogix-prerequisites#exclusion-scope
      - ref:session-host-sizing#logon-storm-headroom
      - ref:avd-insights-glossary#time-to-connect-stages
      - gap:logon-target
      - gap:workload-benchmark
    observations:
      - obs:defender-cache-maintenance-not-in-image
      - obs:fslogix-exclusions-partial

  - id: multisession-density
    version: 1.0.0
    tier: synthetic
    title: Multi-session persona density and experience gate benchmark
    summary: Ramps scripted multi-user processes calibrated to light (6/vCPU), medium (4/vCPU), heavy (2/vCPU) and power (1/vCPU) classes on one host while sampling CPU, processor queue length, memory per session and User Input Delay.
    harness: PowerShell multi-session persona worker loops plus PerfMon counters (User Input Delay per Session, Processor Time, Processor Queue Length, Available MBytes)
    parameters:
      - name: stepDurationMinutes
        value: 15
        unit: minutes
      - name: inputDelayGateP95Ms
        value: 100
        unit: ms
      - name: cpuGateP95Pct
        value: 80
        unit: percent
    metrics:
      - metric: sessionsPerVcpuTested
        unit: users-per-vcpu
      - metric: maxPassingSessionsPerVcpu
        unit: users-per-vcpu
      - metric: cpuPct
        unit: percent
      - metric: pqlPerCore
        unit: ratio
      - metric: availableMemoryMiB
        unit: mib
      - metric: memoryPerSessionMiB
        unit: mib
      - metric: inputDelayMs
        unit: ms
    claims:
      - ref:session-host-sizing#multisession-users-per-vcpu
      - ref:session-host-sizing#multisession-vcpu-range
      - ref:avd-insights-glossary#input-delay-bands
      - ref:avd-insights-use-cases#input-delay-host-100
      - ref:perfmon-troubleshooting#cpu-bands
      - gap:workload-benchmark
      - gap:baseline-profile
    observations:
      - obs:users-per-vcpu-adopted
      - obs:sizing-floor-not-measured

  - id: control-plane-autoscale
    version: 1.0.0
    tier: synthetic
    title: Autoscale, Start VM on Connect and agent maintenance benchmark
    summary: Measures cold boot to Available latency, Start VM on Connect wake wait time, scaling plan ramp-up/drain reaction time, RBAC scope behavior and scheduled agent update window completion.
    harness: Azure Resource Graph, WVDConnections, WVDAgentHealthStatus and Activity Log timers
    parameters:
      - name: lookbackHours
        value: 72
        unit: hours
    metrics:
      - metric: coldBootToAvailableSec
        unit: s
      - metric: startOnConnectWaitSec
        unit: s
      - metric: drainToDeallocateSec
        unit: s
    claims:
      - ref:autoscale-plan#role-at-subscription
      - ref:avd-autoscale#scales-to-save-cost
      - ref:avd-scheduled-agent-updates#hosts-on-during-window
      - ref:cost-management-data#data-latency
      - gap:workload-benchmark
    observations:
      - obs:power-role-at-resource-group-scope
      - obs:scaling-and-start-on-connect-by-default
      - obs:agent-update-window-while-hosts-off
      - obs:run-cost-settles-late

  - id: bcdr-profile-recovery
    version: 1.0.0
    tier: synthetic
    title: Profile share backup and recovery drill benchmark (R0/R1/R2)
    summary: Executes and times R0 (rebuild), R1 (restore anywhere) and R2 (warm standby) recovery drills and verifies Azure Files snapshot and vaulted backup jobs with shared-key access disabled.
    harness: avd-landing-zone recovery drill timer plus Azure Backup job status reader
    parameters:
      - name: recoveryModel
        value: R1
        unit: model
    metrics:
      - metric: measuredRtoMinutes
        unit: minutes
      - metric: measuredRpoMinutes
        unit: minutes
      - metric: backupJobSuccess
        unit: bool
    claims:
      - ref:avd-multiregion-bcdr#rto-rpo-by-model
      - ref:files-backup-support#key-access-needed
      - ref:waf-disaster-recovery#drills-prove-targets
      - gap:workload-benchmark
    observations:
      - obs:recovery-tiers-not-yet-tested
      - obs:files-backup-key-access-off

  - id: insights-observational
    version: 1.0.0
    tier: observational
    title: Longitudinal AVD Insights and PerfMon telemetry benchmark
    summary: Read-only 7-to-30-day KQL aggregation of WVDConnections, WVDConnectionNetworkData and Perf counters during working hours, grouped by public VM SKU, join type, storage SKU and session density band.
    harness: avd-current-state read-only KQL exporter (Export-AvdBenchmarkEvidence.ps1)
    parameters:
      - name: minWindowDays
        value: 7
        unit: days
    metrics:
      - metric: rttMs
        unit: ms
      - metric: inputDelayMs
        unit: ms
      - metric: timeToConnectMs
        unit: ms
      - metric: cpuPct
        unit: percent
      - metric: availableMemoryMiB
        unit: mib
      - metric: connectionFailureRatePct
        unit: percent
      - metric: shortpathUdpSharePct
        unit: percent
      - metric: turnRelaySharePct
        unit: percent
    claims:
      - ref:advisor-vm-rightsize#lookback
      - ref:avd-prerequisites#rtt-under-150
      - ref:avd-insights-glossary#input-delay-bands
      - ref:rdp-shortpath#symmetric-nat-means-turn
      - ref:configure-rdp-shortpath#verify-transport
      - ref:avd-private-link#full-port-range
      - ref:firewall-avd#bypass-route-for-scale-in
      - gap:insights-facts
      - gap:baseline-profile
    observations:
      - obs:symmetric-nat-egress-means-turn
      - obs:transport-column-names-disagree
      - obs:private-endpoint-nsg-narrower-than-avd-needs
      - obs:hub-route-without-avd-bypass
