id: defender-cache-maintenance-not-in-image
claim: ref:defender-av-vdi#cache-maintenance-before-seal
verdict: not-yet-tested
observed: "The landing zone's image build brings Microsoft Defender Antivirus signatures up to date and fails the build if they stay older than a day, but it doesn't run the cache maintenance task before the image is sealed, which the source says avoids higher CPU on each new host while the task runs. How much CPU and logon time that costs on the first sessions of a new host is unmeasured (gap:security-agents-scope)."
evidence:
