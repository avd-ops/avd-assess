id: wdot-pin-on-image-version
claim: ref:wdot#optimization-state
verdict: extends
observed: What runs inside the guest isn't visible from the control plane, but the landing zone's image build tags each gallery image version with the WDOT release, commit and profile hash it ran, so a Reader can see which pin and profile an image claims. Images built any other way carry no such record.
