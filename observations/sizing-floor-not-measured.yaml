id: sizing-floor-not-measured
claim: ref:session-host-sizing#multisession-vcpu-range
verdict: not-yet-tested
observed: The landing zone's minimum kit defaults to a 4-vCPU memory-optimized host, which is Microsoft's stated floor and below its 6 to 24 vCPU range, chosen for the smallest test cost. The reasoning that shared hosts run out of memory before CPU is our hypothesis; no measurement backs it yet.
evidence:
