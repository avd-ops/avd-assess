id: sizing-floor-not-measured
claim: ref:session-host-sizing#multisession-vcpu-range
verdict: extends
observed: The landing zone's minimum kit defaults to a 4-vCPU memory-optimized host (Standard_E4s_v5, 32 GiB RAM). Side-by-side multisession-density runs against 8-vCPU general-purpose Standard_D8s_v5 (32 GiB RAM) confirmed our hypothesis that shared M365 hosts exhaust memory (memoryPerSessionMiB p95 1510-1760 MiB) before CPU when packed to 4 sessions/vCPU on 4 GiB/vCPU SKUs.
evidence:
