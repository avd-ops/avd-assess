id: landing-zone-alerts-read-the-wvd-tables
claim: ref:diagnostics-log-analytics#service-error-split
verdict: extends
observed: The landing zone sends every diagnostic category of its host pool, application group and workspace to its workspace and ships three log alerts a triage can start from - more than 10 admin-fixable errors (ServiceError false) by code in the window, a host whose latest agent health row is neither Available nor Upgrading (with no power-state filter, so a host that reported Unavailable just before it was deallocated can fire it), and any FSLogix error event. The split by ServiceError follows the source; the threshold of 10 and the Upgrading exclusion are the family's own choices, not published numbers, and no run has yet checked that the alerts fire on a broken host.
evidence:
  - https://github.com/avd-ops/avd-landing-zone/blob/91c7acf2924ccf3cf82458b3969c0f3fbb9db2bc/bicep/modules/monitoring.bicep
  - https://github.com/avd-ops/avd-landing-zone/blob/91c7acf2924ccf3cf82458b3969c0f3fbb9db2bc/bicep/modules/controlPlane.bicep
date: 2026-10-21
