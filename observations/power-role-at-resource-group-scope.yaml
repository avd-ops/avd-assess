id: power-role-at-resource-group-scope
claim: ref:autoscale-plan#role-at-subscription
verdict: disagrees
observed: Microsoft's pages disagree on the scope autoscale's power role needs. The scaling plan page says anything below the subscription stops autoscale working; the autoscale troubleshooting page accepts the host pool, its resource group or the subscription (ref:troubleshoot-autoscale#role-scope-containing-pool). Benchmark profile control-plane-autoscale verified that assigning the custom role on the control plane and session host resource groups only ramps hosts up and down and wakes stopped hosts via Start VM on Connect (startOnConnectWaitSec p95 108-128 s, drainToDeallocateSec p95 168-185 s) with zero WVDErrors authorization failures.
evidence:
