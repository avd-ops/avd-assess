id: symmetric-nat-egress-means-turn
claim: ref:rdp-shortpath#symmetric-nat-means-turn
verdict: agrees
observed: Both landing zone network modes give hosts symmetric NAT egress, a NAT Gateway when standalone and the hub firewall when hub-peered, so by Microsoft's claim public-network Shortpath relays through TURN rather than connecting directly. Observational benchmark profile insights-observational confirmed turnRelaySharePct of 94.2% and shortpathUdpSharePct of 0.0% behind NAT Gateway egress, with rttMs p50 at 31 ms and p95 at 56 ms (passing the 150 ms experience gate).
