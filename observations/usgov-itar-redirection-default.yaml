id: usgov-itar-redirection-default
claim: ref:avd-security-guide#device-redirection
verdict: extends
observed: While commercial estates keep clipboard, printer, smart card, WebAuthn and camera redirection enabled by default for usability and score them as warn, estates with complianceProfile set to itar-cui disable clipboard, drive, USB and printer redirection by default and evaluate enabled redirection as a high-severity gap.
