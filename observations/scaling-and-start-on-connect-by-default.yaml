id: scaling-and-start-on-connect-by-default
claim: ref:avd-autoscale#scales-to-save-cost
verdict: agrees
observed: The landing zone deploys a power management scaling plan (depth-first ramp-down that stops hosts at zero sessions, without forcing sign-out) and Start VM on Connect on by default, every resource group and resource carries workload and environment tags, and session hosts carry cm-resource-parent set to the host pool resource ID. Benchmark profile control-plane-autoscale measured drain-to-deallocate (p95 168-185 s) and Start VM on Connect wake (p95 108-128 s), confirming off-peak compute hours stay deallocated while preserving on-demand sign-in.
