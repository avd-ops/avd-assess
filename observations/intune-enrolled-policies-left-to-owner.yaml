id: intune-enrolled-policies-left-to-owner
claim: ref:avd-management#intune-recommended
verdict: extends
observed: The landing zone enrolls its Entra joined hosts in Intune by default (the Entra login extension carries Intune's MDM ID) but assigns no configuration, compliance, baseline or update policy; its scope page leaves those to the organization. An enrolled host is therefore not yet a managed one, and under the tenant's default compliance setting it counts as compliant with no policy at all. Enrollment and policy are separate rows for that reason.
evidence:
  - https://github.com/avd-ops/avd-landing-zone/blob/91c7acf2924ccf3cf82458b3969c0f3fbb9db2bc/bicep/modules/sessionHosts.bicep
  - https://github.com/avd-ops/avd-landing-zone/blob/91c7acf2924ccf3cf82458b3969c0f3fbb9db2bc/docs/out-of-scope.md
date: 2026-10-21
