id: run-cost-settles-late
claim: ref:cost-management-data#data-latency
verdict: agrees
observed: The run recorder spec keeps each run's expected and actual cost as contract C17 (avd-run-cost/v1), appends a reading until it is unchanged for 72 hours, and reports pending rather than a guess until then. Sandbox batch statements confirmed that pay-as-you-go Cost Management charges appear 24 to 48 hours after teardown and settle within the 72-hour window.
evidence:
