id: transport-column-names-disagree
claim: ref:configure-rdp-shortpath#verify-transport
verdict: not-yet-tested
observed: "Two Learn pages query a WVDConnections UdpUse column, while the table reference lists TransportType (Shortpath, TURN, Websocket) and no UdpUse, and Insights uses a third set of values. Because a bare UdpUse identifier in KQL fails compilation (SEM0100) when a workspace schema carries only TransportType, avd-swarm's connection transport query wraps UdpUse in column_ifexists('UdpUse', '') alongside TransportType until a live sandbox connection settles which column exists (gap:transport-classification)."
evidence:
  - https://github.com/avd-ops/avd-second-brain/blob/4f6934160e9d33e2f56f918d44f08532cc63c977/docs/knowledge/agents/README.md
