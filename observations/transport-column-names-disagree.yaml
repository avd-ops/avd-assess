id: transport-column-names-disagree
claim: ref:configure-rdp-shortpath#verify-transport
verdict: extends
observed: "Two Learn pages query a WVDConnections UdpUse column, while the table reference lists TransportType (Shortpath, TURN, Websocket) and no UdpUse, and Insights uses a third set of values. Observational benchmark profile insights-observational verified that live Log Analytics workspaces expose UdpUse alongside or instead of TransportType depending on diagnostic schema version, confirming that portable KQL queries must wrap both in column_ifexists('UdpUse', '') and column_ifexists('TransportType', '') (gap:transport-classification)."
