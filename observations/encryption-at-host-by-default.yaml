id: encryption-at-host-by-default
claim: ref:disk-encryption-options#encryption-at-host
verdict: not-yet-tested
observed: The landing zone turns encryption at host on by default and registers the subscription feature it needs, so it never uses Azure Disk Encryption. No run has measured whether it changes host performance, which the source says it doesn't.
