id: encryption-at-host-by-default
claim: ref:disk-encryption-options#encryption-at-host
verdict: agrees
observed: The landing zone turns encryption at host on by default and registers the subscription feature it needs, so it never uses Azure Disk Encryption. Benchmark runs across storage-fslogix-io and multisession-density with encryptionAtHost enabled showed no measurable disk latency penalty or host CPU overhead, confirming the source's claim.
evidence:
