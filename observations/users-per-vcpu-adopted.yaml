id: users-per-vcpu-adopted
claim: ref:session-host-sizing#multisession-users-per-vcpu
verdict: agrees
observed: Adopted as the landing zone's automatic sizing input. Benchmark profile multisession-density at 4 sessions per vCPU (medium workload) confirmed that memory-optimized Standard_E4s_v5 (8 GiB/vCPU) with WDOT passes the experience gate (inputDelayMs p95 68 ms, cpuPct p95 78.6%, availableMemoryMiB p10 8420 MiB), while 4 GiB/vCPU Standard_D8s_v5 without WDOT tops out at 3 passing sessions per vCPU due to memory pressure.
evidence:
  - https://github.com/avd-ops/avd-landing-zone/blob/150331e37d66370438bdd7867398693eaa0935aa/build/decisions/0010-sizing-and-cost.md
