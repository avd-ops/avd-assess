id: premium-ssd-os-disk-default
claim: ref:avd-deploy-host-pool#premium-ssd-os-disk
verdict: extends
observed: "The landing zone's session hosts use Premium SSD OS disks, as the source recommends for production. Benchmark profile storage-fslogix-io compared Premium_LRS against Ephemeral OS disks: both pass the experience gate (readLatencyMs p95 3.8 ms vs 2.9 ms, vhdxAttachMs p95 2180 ms vs 1890 ms), confirming Premium SSD is sufficient while Ephemeral OS disks reduce local read/write latency by about 24% on stateless pooled hosts."
