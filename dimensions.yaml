# The deployment dimension register (gap:deployment-dimensions). One row per thing that matters when an
# AVD estate is deployed or changed: what it decides, where it lives in the contracts, the baseline that
# says what good looks like and its source, what avd-current-state can see of it today, and which
# avd-landing-zone parameters set it. Changed only by a pull request a person merges.
#
# home.decision / home.facts: IDs from contracts/fact-register.json, or "proposed:<id>" for ones the
#   register doesn't have yet. home.checks: check IDs in method.json.
# baseline.standing: published (a source states it) | prior (a source states it but calls it an estimate)
#   | guidance (a source gives direction, no number) | gap (no source; our method in the gap page)
#   | owned (another method in this repo owns the baseline; see seeAlso).
# pillar: the map pillar that owns the row, an id in pillars.yaml (one per row, required). Not a
#   Well-Architected pillar; those stay on checks. tests/check_dimensions.py checks it against pillars.yaml.
# measure: fact (a built C11 fact) | rebuild (in avd-current-state's private rebuild package, not a C11
#   fact) | measured (needs performance, in-guest or diagnostic log data) | intake (only the operator knows) | host-side (only
#   a read on a session host sees it) | directory (needs a directory read) | none.
# landingZone: parameter names in avd-landing-zone bicep/main.bicep at the commit below. Every one of the
#   57 is either set by a dimension or listed in notDimensions with a reason (tests/check_dimensions.py).
schema: avd-assess-dimensions/v1
landingZone:
  commit: ae5c2877d53d9af8e1efbf47b85cfdef06c51364
  source: https://github.com/nickprignano/avd-landing-zone/blob/ae5c2877d53d9af8e1efbf47b85cfdef06c51364/bicep/main.bicep
  parameters: [namePrefix, environmentName, location, tags, avdUsersGroupObjectId, avdAdminsGroupObjectId,
    avdServicePrincipalObjectId, enrollInIntune, connectivityMode, spokeAddressPrefix, sessionHostSubnetPrefix,
    privateEndpointSubnetPrefix, deployImageBuildSubnets, imageBuildSubnetPrefix, imageBuildAciSubnetPrefix,
    hubVnetResourceId, createHubToSpokePeering, hubFirewallPrivateIp, dnsServers, centralPrivateDnsZoneResourceIds,
    enableAvdPrivateLink, sessionHostCount, sessionHostVmSize, sessionHostNamePrefix, availabilityZones,
    sessionHostImage, maxSessionLimit, encryptionAtHost, localAdminUsername, localAdminPassword, rdpProperties,
    validationEnvironment, profileStorageSku, profileShareQuotaGiB, fslogixProfileSizeMiB, enableProfileBackup,
    profileBackupRetentionDays, profileBackupTier, startVmOnConnect, scalingTimeZone, logRetentionDays, alertEmailAddresses,
    monthlyBudgetAmount, budgetStartDate, enableAutoShutdown, autoShutdownTime, autoShutdownDays,
    autoShutdownTimeZone, autoShutdownScheduleAction, autoShutdownBudgetAction, autoShutdownBudgetPercent,
    autoShutdownRunbookUri, enableDefenderForCloud, deploySubscriptionSettings, enablePolicyGuardrails,
    recoveryLocation, allowedLocations]
  notDimensions:
    namePrefix: Naming only.
    environmentName: A label; its one effect (validation pool default) is under updates.validation-pool.
    sessionHostNamePrefix: Naming only.
    avdUsersGroupObjectId: Wiring to the operator's own group, not a design choice with a baseline.
    avdAdminsGroupObjectId: Wiring to the operator's own group, not a design choice with a baseline.
    avdServicePrincipalObjectId: The service's own identity in the tenant; fixed, not chosen.
    localAdminUsername: Break-glass account name; the security method covers local admin rights.
    localAdminPassword: A secret, recreated on every rebuild and never carried.
    alertEmailAddresses: Contact data, kept out of shared facts; monitoring itself is ops.monitoring.

dimensions:
  # Compute and density
  - id: compute.vm-size
    area: compute
    pillar: capacity
    title: Session host VM size and family
    decides: The vCPU, memory and family of each host pool's VMs.
    home: {decision: hostPool.vmSize, facts: [c11.hostPool.vmSizes, c12.group.perHost.p95CpuPercent, c12.group.perHost.p95MemoryPercent]}
    baseline:
      standing: prior
      claims: [ref:session-host-sizing#multisession-minimums, ref:session-host-sizing#multisession-vcpu-range, ref:session-host-sizing#single-session-minimums, ref:review-checklists-avd#C01.05, ref:review-checklists-avd#C01.10]
      says: Multi-session hosts of 8 vCPU and 16 GB or more, between 6 and 24 vCPU and never over 32 cores; single-session from 2 vCPU and 8 GB. Estimates to replace with a workload test.
    observations: [obs:sizing-floor-not-measured]
    measure: fact
    landingZone: [sessionHostVmSize]
  - id: compute.memory-per-user
    area: compute
    pillar: capacity
    title: Memory per user
    decides: Whether memory or CPU limits a host, and so the family (general purpose or memory-optimized).
    home: {decision: hostPool.vmSize, facts: [c12.group.perUser.p95MemoryMiB, c12.group.perUser.p50MemoryMiB]}
    baseline:
      standing: gap
      claims: [ref:session-host-sizing#memory-limits-density, gap:deployment-dimensions, gap:sample-check]
      says: The source says memory can limit density but gives no memory per user; the estate's own measurement sets it.
    measure: measured
    landingZone: [sessionHostVmSize]
  - id: compute.host-count
    area: compute
    pillar: capacity
    title: Host count and headroom
    decides: How many hosts each pool has, including headroom for sign-in storms and a spare.
    home: {decision: hostPool.hosts, facts: [c11.hostPool.sessionHosts.total, c12.group.concurrency.peak, c12.group.concurrency.byHour], checks: [asm-pooled-host-redundancy]}
    baseline:
      standing: guidance
      claims: [ref:waf-reliability-checklist#RE:05, ref:session-host-sizing#logon-storm-headroom, ref:session-host-sizing#more-smaller-vms]
      says: At least two hosts per pooled pool, headroom for concurrent sign-ins, and more smaller hosts over fewer large ones; no headroom number is published.
    measure: fact
    landingZone: [sessionHostCount]
  - id: density.sessions-per-host
    area: density
    pillar: capacity
    title: User to host density
    decides: The maximum sessions per host.
    home: {decision: hostPool.maxSessions, facts: [c11.hostPool.maxSessionLimit, c11.hostPool.sessionHosts.sessions, c12.group.perHost.peakSessionsPerHost, c12.group.perUser.p95CpuPercentOfCore]}
    baseline:
      standing: prior
      claims: [ref:session-host-sizing#multisession-users-per-vcpu, ref:session-host-sizing#estimates-only, ref:avd-host-pool-types#limit-can-be-exceeded]
      says: "Users per vCPU: light 6, medium 4, heavy 2, power 1, as estimates; the limit can be exceeded under a connection storm."
    observations: [obs:users-per-vcpu-adopted]
    measure: fact
    landingZone: [maxSessionLimit]
  - id: density.load-balancing
    area: density
    pillar: capacity
    title: Load balancing algorithm
    decides: Breadth-first (performance) or depth-first (cost) placement of new sessions.
    home: {decision: proposed:hostPool.loadBalancing, facts: [proposed:c11.hostPool.loadBalancerType]}
    baseline:
      standing: guidance
      claims: [ref:avd-load-balancing#breadth-first-performance, ref:avd-load-balancing#depth-first-cost, ref:avd-load-balancing#set-limit-from-insights, ref:review-checklists-avd#C01.04]
      says: Breadth-first favors session performance, depth-first favors cost and needs a measured session limit.
    measure: rebuild
    landingZone: []
    note: The landing zone fixes breadth-first in its control plane module; there is no parameter.
  - id: compute.workload-benchmark
    area: performance
    pillar: capacity
    title: Workload benchmark before sizing
    decides: How the size and density above are proven for this estate's workload.
    home: {decision: hostPool.vmSize, facts: [c12.group.perUser.p95CpuPercentOfCore, c12.group.logonSeconds.p95]}
    baseline:
      standing: gap
      claims: [ref:review-checklists-avd#C01.10, ref:session-host-sizing#capacity-approaches, gap:deployment-dimensions]
      says: Run a pilot or a simulated load test before fixing size and density; no open, published workload or pass threshold exists, so the method is ours.
    measure: measured
    landingZone: []

  # Graphics
  - id: graphics.gpu-need
    area: graphics
    pillar: capacity
    title: Whether hosts need a GPU
    decides: GPU or CPU-only hosts for each workload.
    home: {decision: proposed:hostPool.gpu, facts: [c11.hostPool.vmSizes], intake: [proposed:intake.graphicsWorkloads]}
    baseline:
      standing: guidance
      claims: [ref:review-checklists-avd#C01.12, ref:session-host-sizing#gpu-for-graphics]
      says: Use GPU hosts for graphics-heavy apps and high resolutions; CPU-only hosts show artifacts above 3840 x 2160 total resolution.
    measure: intake
    landingZone: [sessionHostVmSize]
  - id: graphics.gpu-size
    area: graphics
    pillar: capacity
    title: GPU size and driver
    decides: Which GPU series and fraction, and which driver.
    home: {decision: proposed:hostPool.gpu, facts: [c11.hostPool.vmSizes]}
    baseline:
      standing: published
      claims: [ref:avd-gpu-acceleration#supported-sizes, ref:avd-gpu-acceleration#no-compute-gpus, ref:avd-gpu-acceleration#grid-driver-only]
      says: Only the NV-family sizes the page lists, never NC or ND compute sizes, with Azure-distributed drivers (GRID on NVIDIA).
    measure: fact
    landingZone: [sessionHostVmSize]
    note: The source's size table lists series that retired on 2026-09-30 (see the reference's notes).
  - id: graphics.users-per-gpu
    area: graphics
    pillar: capacity
    title: Users per GPU
    decides: How many sessions share one GPU or GPU fraction.
    home: {decision: hostPool.maxSessions, facts: [c12.group.perHost.peakSessionsPerHost]}
    baseline:
      standing: gap
      claims: [ref:avd-gpu-acceleration#density-tradeoff, ref:avd-gpu-acceleration#grid-license-25, gap:deployment-dimensions]
      says: No published users-per-GPU number; the GRID license caps a VM at 25 concurrent users, and the estate's measurement sets the rest.
    measure: measured
    landingZone: [maxSessionLimit]

  # Disks
  - id: disk.os-disk-type
    area: disks
    pillar: capacity
    title: OS disk type
    decides: Premium SSD, Standard SSD or an ephemeral OS disk for session hosts.
    home: {decision: proposed:hostPool.osDisk, facts: [proposed:c11.sessionHost.osDiskType]}
    baseline:
      standing: published
      claims: [ref:avd-deploy-host-pool#premium-ssd-os-disk, ref:review-checklists-avd#H03.01, ref:session-host-sizing#ssd-storage]
      says: Premium SSD for production hosts.
    observations: [obs:premium-ssd-os-disk-default]
    measure: rebuild
    landingZone: []
    note: The landing zone fixes Premium SSD in its session host module; there is no parameter.
  - id: disk.ephemeral-os
    area: disks
    pillar: capacity
    title: Ephemeral OS disks for stateless pools
    decides: Whether a pooled, stateless pool uses ephemeral OS disks.
    home: {decision: proposed:hostPool.osDisk, facts: [proposed:c11.sessionHost.osDiskType]}
    baseline:
      standing: published
      claims: [ref:avd-ephemeral-os-disks#stateless-only, ref:avd-ephemeral-os-disks#pooled-with-configuration, ref:avd-ephemeral-os-disks#unsupported-features, ref:avd-ephemeral-os-disks#size-must-fit-image, ref:avd-ephemeral-os-disks#autoscale-full-active]
      says: Only for pooled pools with a session host configuration, on a size whose temp disk or cache fits the image, with autoscale creating and deleting hosts instead of deallocating them.
    measure: rebuild
    landingZone: []
  - id: disk.latency
    area: disks
    pillar: capacity
    title: Disk latency on hosts
    decides: Whether host disks are fast enough for the workload.
    home: {decision: hostPool.vmSize, facts: [c12.group.perUser.p95DiskIops]}
    baseline:
      standing: gap
      claims: [gap:sample-check, gap:deployment-dimensions]
      says: No published latency number for session hosts; the estate's own baseline sets it (gold-standards.yaml, disk-latency).
    measure: measured
    landingZone: []

  # Profiles
  - id: profile.storage-backend
    area: storage
    pillar: profiles
    title: Profile storage service and tier
    decides: Azure Files standard or premium, or Azure NetApp Files, in the hosts' region.
    home: {decision: proposed:profile.storage, facts: [c11.storage.kind, c11.storage.sku]}
    baseline:
      standing: published
      claims: [ref:avd-fslogix-storage#azure-files-default, ref:avd-fslogix-storage#tier-by-workload, ref:review-checklists-avd#H03.02, ref:review-checklists-avd#H03.05, ref:fslogix-prerequisites#storage-latency]
      says: Azure Files for most estates; premium for anything above light workloads under 200 users; always in the hosts' region.
    measure: fact
    landingZone: [profileStorageSku]
  - id: profile.storage-performance
    area: storage
    pillar: profiles
    title: Profile storage IOPS and scale
    decides: Provisioned IOPS, share count and handle headroom for sign-in storms.
    home: {decision: hostPool.profileQuotaGiB, facts: [c12.group.profile.logonIopsPerUser, c12.group.users]}
    baseline:
      standing: prior
      claims: [ref:fslogix-storage-options#iops-per-user, ref:azure-files-vdi#storm-sizing, ref:azure-files-vdi#users-per-share, ref:azure-files-vdi#handle-limits, ref:review-checklists-avd#H01.02, ref:review-checklists-avd#H03.04, ref:review-checklists-avd#E02.03]
      says: About 10 IOPS per user steady and 50 at sign-in, as an example; share count by concurrent users; SMB multichannel on premium; alert on throttling.
    measure: measured
    landingZone: [profileShareQuotaGiB]
  - id: profile.capacity
    area: storage
    pillar: profiles
    title: Profile size and share capacity
    decides: The per-user container limit and the share quota.
    home: {decision: hostPool.profileQuotaGiB, facts: [c12.group.profile.p95SizeGiB, c11.storage.count]}
    baseline:
      standing: prior
      claims: [ref:session-host-sizing#profile-storage-minimum, ref:review-checklists-avd#H04.03]
      says: Plan at least 30 GB per user and confirm the configured maximum profile size.
    measure: rebuild
    landingZone: [profileShareQuotaGiB, fslogixProfileSizeMiB]
  - id: profile.resilience
    area: reliability
    pillar: profiles
    title: Profile redundancy and backup
    decides: Storage redundancy and backup of profile containers.
    home: {decision: proposed:profile.storage, facts: [c11.storage.sku], checks: [asm-files-zone-redundant]}
    baseline:
      standing: published
      claims: [ref:review-checklists-avd#A03.05, ref:review-checklists-avd#A03.02]
      says: Zone-redundant storage for Azure Files, and a backup strategy for profile containers.
    measure: rebuild
    landingZone: [profileStorageSku, enableProfileBackup, profileBackupRetentionDays, profileBackupTier]

  # Performance optimizations
  - id: perf.image-optimization
    area: performance
    pillar: images
    title: Image optimization
    decides: Which OS optimizations the image applies, from a reviewed profile.
    home: {decision: proposed:hostPool.image, facts: [c11.hostPool.images]}
    baseline:
      standing: guidance
      claims: [ref:wdot#categories, ref:wdot#optimization-state, ref:wdot#test-first, ref:vdi-optimization-guide#test-cleanup-first, ref:review-checklists-avd#B01.08]
      says: Apply a reviewed optimization profile, tested before production; the templates are a start, not a verdict.
    observations: [obs:wdot-appx-removal-left-off, obs:wdot-disk-cleanup-deletes-evidence, obs:wdot-pin-on-image-version]
    measure: fact
    landingZone: []
    note: Set in the landing zone's image build, not a template parameter.
  - id: perf.transport
    area: performance
    pillar: protocol
    title: RDP transport
    decides: Whether sessions use the UDP transport (RDP Shortpath) on managed and public networks, judged against the networks the operator says users connect from.
    home: {decision: network, facts: [c12.group.rttMsP95, proposed:c12.group.transport.udpShare, proposed:c12.group.transport.relayShare], intake: [proposed:intake.userNetworks]}
    baseline:
      standing: published
      claims: [ref:rdp-shortpath#udp-transport, ref:rdp-shortpath#tcp-first-then-udp, ref:rdp-shortpath#stun-before-turn, ref:review-checklists-avd#F01.11, gap:transport-classification, gap:remote-protocols-scope]
      says: UDP where the network allows it, direct before relayed, with TCP reverse connect as the fallback; each connection is judged against the operator's stated networks through the family transport map. No share target is published.
    observations: [obs:transport-column-names-disagree, obs:symmetric-nat-egress-means-turn]
    measure: measured
    landingZone: []
    note: Needs the host pool's network data and connection categories in Log Analytics (ops.monitoring).
  - id: perf.media
    area: performance
    pillar: protocol
    title: Teams and browser media
    decides: Media optimization for Teams and multimedia redirection for browser video.
    home: {decision: proposed:hostPool.image, facts: [c11.hostPool.images]}
    baseline:
      standing: published
      claims: [ref:teams-on-avd#media-optimization, ref:teams-on-avd#classic-teams-end, ref:review-checklists-avd#B01.10, ref:review-checklists-avd#B03.02]
      says: Teams calls and meetings redirected to the local device; classic Teams for VDI is past end of support.
    measure: none
    landingZone: []
  # Remote protocol and session (pillar protocol, methods/remote-protocols.md)
  - id: protocol.shortpath-managed
    area: protocol
    pillar: protocol
    title: RDP Shortpath for managed networks
    decides: Whether users on ExpressRoute or VPN get a direct UDP path, through the host listener and an inbound port or through ICE/STUN.
    home: {decision: network, facts: [proposed:c11.hostPool.udp.managedPrivate, proposed:c11.hostPool.udp.direct], intake: [proposed:intake.userNetworks]}
    baseline:
      standing: published
      claims: [ref:configure-rdp-shortpath#four-options, ref:configure-rdp-shortpath#listener-for-managed, ref:configure-rdp-shortpath#most-restrictive-wins, ref:rdp-shortpath#first-found-wins, ref:review-checklists-avd#F01.11]
      says: Evaluate Shortpath for clients on managed networks; the listener (port 3390 by default) and an inbound allow rule are needed only for the listener option, and the most restrictive of host pool and host settings wins.
    measure: rebuild
    landingZone: []
    note: The host listener is host policy, outside the landing zone's parameters; the host pool switches are readable only through a preview API version (protocol.shortpath-public).
  - id: protocol.shortpath-public
    area: protocol
    pillar: protocol
    title: RDP Shortpath for public networks (STUN and TURN)
    decides: Whether users on the internet get a direct UDP path through STUN or a relayed one through TURN (expected behind symmetric NAT egress), and whether either is turned off.
    home: {decision: network, facts: [proposed:c11.hostPool.udp.public, proposed:c11.hostPool.udp.relay, proposed:c12.group.transport.relayShare]}
    baseline:
      standing: published
      claims: [ref:configure-rdp-shortpath#defaults-enabled, ref:configure-rdp-shortpath#hostpool-switches, ref:configure-rdp-shortpath#select-transport-policy, ref:configure-rdp-shortpath#turn-public-cloud-only, ref:rdp-shortpath#stun-before-turn, ref:rdp-shortpath#turn-range, ref:rdp-shortpath#symmetric-nat-means-turn, ref:rdp-shortpath#public-network-advice, ref:rdp-shortpath#turn-maintenance-drops, ref:hostpool-api-changelog#udp-switches-preview-only, ref:troubleshoot-rdp-shortpath#nat-type-test]
      says: Both options are on by default and work with no configuration when outbound UDP is allowed; hosts behind Azure Firewall or NAT Gateway relay through TURN. Turning an option off needs a reason.
    observations: [obs:symmetric-nat-egress-means-turn]
    measure: measured
    landingZone: []
    note: The landing zone leaves the host pool switches at Default; the networking pillars own the egress rules that decide STUN or TURN.
  - id: protocol.port-range
    area: protocol
    pillar: protocol
    title: UDP port range for STUN and TURN
    decides: Whether hosts use the default ephemeral range or a smaller, predictable one that firewalls can name.
    home: {decision: network, facts: []}
    baseline:
      standing: guidance
      claims: [ref:configure-rdp-shortpath#port-range, ref:rdp-multipath#ports-per-session]
      says: The default range works; narrow it only when a firewall must name ports, and size it for up to three UDP paths per session.
    measure: rebuild
    landingZone: []
    note: Host policy, outside the landing zone's parameters.
  - id: protocol.multipath
    area: protocol
    pillar: protocol
    title: RDP Multipath and modern auto-reconnect
    decides: Whether sessions keep backup paths and survive short network drops, which depends on the client app and version.
    home: {decision: network, facts: [], intake: [proposed:intake.clientApps]}
    baseline:
      standing: published
      claims: [ref:rdp-multipath#automatic, ref:rdp-multipath#client-floors, ref:rdp-multipath#shortpath-first, ref:avd-auto-reconnect#needs-multipath, ref:windows-app-platforms#multipath-by-platform, ref:avd-whats-new#multipath-ga]
      says: Automatic once Shortpath works, on current Windows App for Windows; other platforms are in beta or unsupported.
    measure: measured
    landingZone: []
  - id: protocol.private-link-udp
    area: protocol
    pillar: protocol
    title: UDP over Private Link
    decides: Whether sessions that use Private Link can still use UDP.
    home: {decision: network, facts: [proposed:c11.hostPool.udp.privateLink, c11.network.privateEndpoints]}
    baseline:
      standing: published
      claims: [ref:hostpool-api-changelog#private-link-udp-preview-only, ref:configure-rdp-shortpath#hostpool-switches]
      says: UDP over Private Link is a separate host pool opt-in, off unless set and readable only through a preview API version; its conditions are claims in the networking pillar's Private Link reference.
    measure: rebuild
    landingZone: [enableAvdPrivateLink]
  - id: protocol.qos
    area: protocol
    pillar: protocol
    title: QoS marking and throttle rate
    decides: Whether RDP traffic on managed networks is marked for priority (DSCP) or capped per session.
    home: {decision: network, facts: [], intake: [proposed:intake.userNetworks]}
    baseline:
      standing: guidance
      claims: [ref:rdp-qos#managed-udp-only, ref:rdp-qos#dscp-46, ref:rdp-qos#qos-before-bandwidth, ref:rdp-shortpath#managed-qos-and-throttle, ref:rdp-bandwidth#throttle-managed-only]
      says: Only on managed-network Shortpath; DSCP 46 applied end to end, QoS before more bandwidth, and no throttle unless the network is constrained or metered.
    measure: none
    landingZone: []
  - id: protocol.graphics-encoding
    area: protocol
    pillar: protocol
    title: Graphics encoding and codecs
    decides: Software or hardware encoding, AVC 444, HEVC and chroma, set by host policy against the host's GPU and the client's decoder.
    home: {decision: hostPool.vmSize, facts: [c11.hostPool.vmSizes], intake: [proposed:intake.graphicsWorkloads]}
    baseline:
      standing: published
      claims: [ref:graphics-encoding#software-default, ref:graphics-encoding#codecs, ref:avd-gpu-acceleration#cpu-by-default, ref:avd-gpu-acceleration#avc444-needs-hw-encoding, ref:avd-gpu-acceleration#hevc-prerequisites, ref:avd-gpu-acceleration#verify-by-event, ref:graphics-chroma-444#only-support-verifies]
      says: CPU encoding by default; AVC 444 only with hardware encoding on, HEVC only on GPU desktops without multimedia redirection; verify with host events, not assumption.
    measure: rebuild
    landingZone: []
    note: Host policy; graphics.gpu-need and graphics.gpu-size decide the hardware.
  - id: protocol.session-limits
    area: protocol
    pillar: protocol
    title: Session time limits and lock behavior
    decides: When disconnected sessions are signed out and whether a lock disconnects the session or shows the remote lock screen.
    home: {decision: hostPool.power, facts: []}
    baseline:
      standing: guidance
      claims: [ref:autoscale-faq#disconnected-time-limit, ref:session-lock-behavior#disconnect-on-lock-sso]
      says: Sign out disconnected sessions after 15 to 30 minutes where pools scale to zero; with Entra single sign-on, disconnect on lock so Conditional Access is evaluated again.
    measure: rebuild
    landingZone: []
    note: Host policy, outside the landing zone's parameters.
  - id: perf.accelerated-networking
    area: performance
    pillar: capacity
    title: Accelerated networking
    decides: Whether host NICs use accelerated networking.
    home: {decision: hostPool.vmSize, facts: [proposed:c11.sessionHost.acceleratedNetworking]}
    baseline:
      standing: guidance
      claims: [ref:review-checklists-avd#C01.13]
      says: Choose sizes that support accelerated networking.
    measure: rebuild
    landingZone: []
  - id: perf.experience-targets
    area: performance
    pillar: ux-measurement
    title: User experience targets
    decides: The round-trip, input delay and logon targets a deployment is judged against.
    home: {decision: region, facts: [c12.group.rttMsP95, c12.group.logonSeconds.p95, c12.group.uxScoreMedian]}
    baseline:
      standing: published
      claims: [ref:avd-prerequisites#rtt-under-150, ref:avd-insights-glossary#input-delay-bands, gap:logon-target]
      says: Round trip under 150 ms, input delay bands as published, logon against the estate's own baseline (gold-standards.yaml).
    observations: [obs:region-latency-from-the-user]
    measure: measured
    landingZone: []
  - id: network.bandwidth
    area: network
    pillar: networking-client
    title: Bandwidth per user
    decides: Whether user networks and host sizes carry the expected RDP traffic.
    home: {decision: network, facts: [], intake: [proposed:intake.userNetworks]}
