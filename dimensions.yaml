    baseline:
      standing: published
      claims: [ref:troubleshoot-sso-conditional-access#sign-in-logs-first, ref:troubleshoot-sso-conditional-access#aadsts-codes, ref:troubleshoot-sso-conditional-access#frequency-mismatch, ref:troubleshoot-sso-conditional-access#compliance-on-client, ref:troubleshoot-entra-joined#vm-user-login-role, ref:troubleshoot-entra-joined#per-user-mfa-unsupported, ref:troubleshoot-service-connection#conditional-access-blocks, gap:triage-cannot-connect]
      says: Read the user's sign-in entries for the AVD and Windows Cloud Login apps; the AADSTS code and the Conditional Access tab say which policy or registration failed.
