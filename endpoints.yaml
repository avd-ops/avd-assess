# The endpoint map: the AVD endpoints the family's tools probe or report as not tested, one row per
# endpoint, each pointing at the pinned Learn claim that lists it (gap:endpoint-map). Microsoft's page stays
# the source of truth; a row adds what the page doesn't say: where a probe means something (probeFrom),
# whether a tool's overall verdict counts it, and what kind of target it is. Purposes are our own words.
# Addresses and ranges are never restated: a tool takes them from the service tag the row names or from
# the cited page. Changed only by a pull request a person merges.
#
# Built into endpoints.json (contract C20, avd-assess-endpoints/v1) by scripts/build_index.py, which adds
# each row's source URL and pin from references/. tests/check_endpoints.py checks it.
#
# readAt: the Learn git_commit_id of each source page this map was read at. When the weekly pins workflow
#   moves a reference's pin, the test fails until a person re-reads the page and updates rows and readAt.
# version: bumped when a row is renamed or removed (readers key on ids); adding a row doesn't bump it.
# kind: fqdn (a concrete name) | wildcard (a pattern; never probed by name) | range (an address range) |
#   address (a single platform address).
# probeFrom: where a probe of this row says something. browser = a web page on the user's device (HTTPS
#   on 443 only); device = a native tool on the user's device; host = a session host. A probe from
#   anywhere else (Cloud Shell, an operator's machine) is unknown, never pass (gaps/network-scope.md
#   item 3). Empty for wildcards, ranges a probe can't reach by name, and anything nothing probes.
# verdict: required = a failed probe moves a tool's overall verdict; informational = it gets its own
#   sentence and never moves the verdict. Both stay required by Microsoft (ref:avd-required-fqdn#
#   blocking-unsupported); informational only means a lone failure is more often a proxy or blocker than
#   a broken connection (gap:endpoint-map).
schema: avd-assess-endpoints/v1
version: 1
cloud: azure-public
readAt:
  avd-required-fqdn: 05df299786103f3d5886146cf73fab142cda335a
  avd-fabric-ips: 9df01472230d01bf9bb36b02e508abd74e4dc029
lists:
  - id: client
    title: End-user devices
    claim: ref:avd-required-fqdn#client-list
    dimension: network.client
  - id: host
    title: Session hosts
    claim: ref:avd-required-fqdn#host-list
    dimension: network.required-endpoints
  - id: platform
    title: Azure platform addresses on session hosts
    claim: ref:avd-fabric-ips#two-platform-ips
    dimension: network.required-endpoints
endpoints:
  # End-user devices
  - {id: client.service, list: client, kind: wildcard, host: "*.service.windows.cloud.microsoft", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: []}
  - {id: client.windows-cloud, list: client, kind: wildcard, host: "*.windows.cloud.microsoft", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: []}
  - {id: client.windows-static, list: client, kind: wildcard, host: "*.windows.static.microsoft", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: []}
  - {id: client.sign-in, list: client, kind: fqdn, host: login.microsoftonline.com, protocol: tcp, port: 443, purpose: sign-in, verdict: required, probeFrom: [browser, device]}
  - {id: client.relay, list: client, kind: range, protocol: udp, port: 3478, purpose: relay, verdict: informational, probeFrom: [], serviceTag: WindowsVirtualDesktop, note: "Relayed RDP (TURN). Not probeable from a browser; the device-side network test or a STUN check against the pack's own server says more (ref:rdp-shortpath#turn-range)."}
  - {id: client.wvd, list: client, kind: wildcard, host: "*.wvd.microsoft.com", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: [], note: "Feed, broker and gateway. No concrete name is listed at the pin; older names are not probed (avd-linecheck spec Q5)."}
  - {id: client.troubleshooting, list: client, kind: wildcard, host: "*.servicebus.windows.net", protocol: tcp, port: 443, purpose: troubleshooting, verdict: informational, probeFrom: []}
  - {id: client.fwlink, list: client, kind: fqdn, host: go.microsoft.com, protocol: tcp, port: 443, purpose: links-and-docs, verdict: informational, probeFrom: [browser, device], note: "Answers with a redirect; a browser probe lists the redirect targets beside it."}
  - {id: client.shortener, list: client, kind: fqdn, host: aka.ms, protocol: tcp, port: 443, purpose: links-and-docs, verdict: informational, probeFrom: [browser, device], note: "Answers with a redirect; a browser probe lists the redirect targets beside it."}
  - {id: client.docs, list: client, kind: fqdn, host: learn.microsoft.com, protocol: tcp, port: 443, purpose: links-and-docs, verdict: informational, probeFrom: [browser, device]}
  - {id: client.privacy, list: client, kind: fqdn, host: privacy.microsoft.com, protocol: tcp, port: 443, purpose: links-and-docs, verdict: informational, probeFrom: [browser, device]}
  - {id: client.office-cdn, list: client, kind: wildcard, host: "*.cdn.office.net", protocol: tcp, port: 443, purpose: client-updates, verdict: informational, probeFrom: [], note: "Windows desktop client only."}
  - {id: client.graph, list: client, kind: fqdn, host: graph.microsoft.com, protocol: tcp, port: 443, purpose: service, verdict: informational, probeFrom: [browser, device]}
  - {id: client.connection-center, list: client, kind: fqdn, host: windows.cloud.microsoft, protocol: tcp, port: 443, purpose: connection-center, verdict: required, probeFrom: [browser, device]}
  - {id: client.windows365, list: client, kind: fqdn, host: windows365.microsoft.com, protocol: tcp, port: 443, purpose: service, verdict: informational, probeFrom: [browser, device]}
  - {id: client.ecs, list: client, kind: fqdn, host: ecs.office.com, protocol: tcp, port: 443, purpose: connection-center, verdict: informational, probeFrom: [browser, device]}
  - {id: client.telemetry, list: client, kind: wildcard, host: "*.events.data.microsoft.com", protocol: tcp, port: 443, purpose: telemetry, verdict: informational, probeFrom: []}
  - {id: client.cert-aik, list: client, kind: wildcard, host: "*.microsoftaik.azure.net", protocol: tcp, port: 80, purpose: certificates, verdict: informational, probeFrom: []}
  - {id: client.cert-www, list: client, kind: fqdn, host: www.microsoft.com, protocol: tcp, port: 80, purpose: certificates, verdict: informational, probeFrom: [device], note: "Plain HTTP: a page served over HTTPS can't fetch it (mixed content)."}
  - {id: client.cert-aikcertaia, list: client, kind: wildcard, host: "*.aikcertaia.microsoft.com", protocol: tcp, port: 80, purpose: certificates, verdict: informational, probeFrom: []}
  - {id: client.cert-publish, list: client, kind: fqdn, host: azcsprodeusaikpublish.blob.core.windows.net, protocol: tcp, port: 80, purpose: certificates, verdict: informational, probeFrom: [device], note: "Plain HTTP: a page served over HTTPS can't fetch it (mixed content)."}

  # Session hosts. All required: blocking any of them is unsupported, and a host probe has no proxy excuse.
  - {id: host.sign-in, list: host, kind: fqdn, host: login.microsoftonline.com, protocol: tcp, port: 443, purpose: sign-in, verdict: required, probeFrom: [host], serviceTag: AzureActiveDirectory}
  - {id: host.relay, list: host, kind: range, protocol: udp, port: 3478, purpose: relay, verdict: required, probeFrom: [], serviceTag: WindowsVirtualDesktop}
  - {id: host.wvd, list: host, kind: wildcard, host: "*.wvd.microsoft.com", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: [], serviceTag: WindowsVirtualDesktop, note: "The agent's region-specific names are in its event 3701 (ref:avd-required-fqdn#wildcards-required); the Agent URL Tool checks those, not the wildcard (ref:avd-url-check-tool#wildcards-not-checked)."}
  - {id: host.marketplace, list: host, kind: fqdn, host: catalogartifact.azureedge.net, protocol: tcp, port: 443, purpose: marketplace, verdict: required, probeFrom: [host], serviceTag: AzureFrontDoor.Frontend}
  - {id: host.monitor-ingest, list: host, kind: wildcard, host: "*.prod.warm.ingest.monitor.core.windows.net", protocol: tcp, port: 443, purpose: agent, verdict: required, probeFrom: [], serviceTag: AzureMonitor}
  - {id: host.monitor-gcs, list: host, kind: fqdn, host: gcs.prod.monitoring.core.windows.net, protocol: tcp, port: 443, purpose: agent, verdict: required, probeFrom: [host], serviceTag: AzureMonitor}
  - {id: host.activation, list: host, kind: fqdn, host: azkms.core.windows.net, protocol: tcp, port: 1688, purpose: activation, verdict: required, probeFrom: [host], serviceTag: Internet}
  - {id: host.agent-updates, list: host, kind: fqdn, host: mrsglobalsteus2prod.blob.core.windows.net, protocol: tcp, port: 443, purpose: agent, verdict: required, probeFrom: [host], serviceTag: Storage}
  - {id: host.portal-support, list: host, kind: fqdn, host: wvdportalstorageblob.blob.core.windows.net, protocol: tcp, port: 443, purpose: portal-support, verdict: required, probeFrom: [host], serviceTag: AzureCloud}
  - {id: host.cert-ocsp, list: host, kind: fqdn, host: oneocsp.microsoft.com, protocol: tcp, port: 80, purpose: certificates, verdict: required, probeFrom: [host], serviceTag: AzureFrontDoor.FirstParty}
  - {id: host.cert-www, list: host, kind: fqdn, host: www.microsoft.com, protocol: tcp, port: 80, purpose: certificates, verdict: required, probeFrom: [host]}
  - {id: host.cert-aikcertaia, list: host, kind: wildcard, host: "*.aikcertaia.microsoft.com", protocol: tcp, port: 80, purpose: certificates, verdict: required, probeFrom: []}
  - {id: host.cert-publish, list: host, kind: fqdn, host: azcsprodeusaikpublish.blob.core.windows.net, protocol: tcp, port: 80, purpose: certificates, verdict: required, probeFrom: [host]}
  - {id: host.cert-aik, list: host, kind: wildcard, host: "*.microsoftaik.azure.net", protocol: tcp, port: 80, purpose: certificates, verdict: required, probeFrom: []}
  - {id: host.cert-ctl, list: host, kind: fqdn, host: ctldl.windowsupdate.com, protocol: tcp, port: 80, purpose: certificates, verdict: required, probeFrom: [host]}
  - {id: host.shortener, list: host, kind: fqdn, host: aka.ms, protocol: tcp, port: 443, purpose: links-and-docs, verdict: informational, probeFrom: [host], note: "Listed for session host deployment on Azure Local only."}
  - {id: host.service, list: host, kind: wildcard, host: "*.service.windows.cloud.microsoft", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: [], serviceTag: WindowsVirtualDesktop}
  - {id: host.windows-cloud, list: host, kind: wildcard, host: "*.windows.cloud.microsoft", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: []}
  - {id: host.windows-static, list: host, kind: wildcard, host: "*.windows.static.microsoft", protocol: tcp, port: 443, purpose: service, verdict: required, probeFrom: []}

  # Azure platform addresses: never proxied, inspected or tunneled (ref:avd-fabric-ips#never-proxy-or-tunnel).
  - {id: platform.metadata, list: platform, kind: address, protocol: tcp, port: 80, purpose: platform, verdict: required, probeFrom: [host], serviceTag: AzurePlatformIMDS, note: "Instance metadata."}
  - {id: platform.wireserver, list: platform, kind: address, protocol: tcp, port: 80, purpose: platform, verdict: required, probeFrom: [host], serviceTag: AzurePlatformDNS, note: "Platform health and, with Azure-provided DNS, name resolution; other ports are on the cited page."}
