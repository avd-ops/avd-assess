areas: [assessment]
pillars: [endpoints]
claims:
  - id: all-local-printers
    says: Printer redirection redirects every printer on the local device, not a chosen few, and makes the local default printer the session default.
    kind: published
  - id: easy-print
    says: Redirection uses the Remote Desktop Easy Print driver, so no printer drivers go on session hosts; the driver must be on the local device.
    kind: published
  - id: enable-on-hosts-control-on-pool
    says: Enable printer redirection on session hosts through Intune or Group Policy, then control it with the host pool RDP properties.
    kind: guidance
  - id: universal-print-alternative
    says: Universal Print is the documented alternative to redirecting local printers.
    kind: guidance
