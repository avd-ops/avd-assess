id: avd-mfa-conditional-access
title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
url: https://learn.microsoft.com/azure/virtual-desktop/set-up-mfa
pin: "Learn git_commit_id 9e91f2c9068a0844f3041110ca90b6a25540b566, updated_at 2026-07-29"
read: 2026-10-21
license: Microsoft Learn content (link only)
areas: [assessment, collection]
pillars: [identity]
notes: The page the review checklist's G04.01 links to. Every claim here lives in the tenant's directory, not in Azure Resource Manager, so a Reader-only run can't see it (gap:identity-scope). App IDs are on the page and aren't repeated here.
claims:
  - id: licensing
    says: Conditional Access needs Entra ID P1 or P2 for the users and can't be used while Security Defaults are on.
    kind: published
  - id: target-apps
    says: Target the Azure Virtual Desktop app for the service and gateway, and the Windows Cloud Login app for session host sign-in when single sign-on is on.
    kind: published
  - id: two-aligned-policies
    says: Create two policies, one per app, with matching conditions except sign-in frequency, so users aren't prompted unexpectedly.
    kind: guidance
  - id: feed-app-no-mfa
    says: Never put the AVD Azure Resource Manager provider app, which only retrieves the feed, in a policy that requires MFA.
    kind: published
  - id: legacy-clients-off
    says: Apply the policy to browser and desktop and mobile clients, and leave legacy authentication clients out.
    kind: guidance
  - id: per-user-mfa-off
    says: Legacy per-user MFA alongside Conditional Access breaks sign-in to Entra joined hosts; turn it off and use Conditional Access only.
    kind: published
  - id: sign-in-frequency
    says: Sign-in frequency decides how often users reauthenticate; "every time" works only on the Windows Cloud Login app with single sign-on, and a running connection isn't interrupted.
    kind: published
  - id: all-apps-conflicts
    says: Policies on all cloud apps also hit AVD; check them for device compliance (which Entra joined hosts may not meet), location rules (the IP differs between the two apps) and blocks on the Windows 365 app that Windows App also signs in to.
    kind: published
