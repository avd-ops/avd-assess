claims:
  - id: single-container-recommended
    says: Unless configured otherwise, the profile container holds profile and Office data in one disk, and that is the recommended configuration.
    kind: published
  - id: odfc-optional
    says: The Office (ODFC) container is optional and mostly used beside another roaming profile solution, which must then exclude the Office data.
    kind: published
  - id: odfc-when
    says: Split profile and Office containers only for a reason (separate storage, isolation from corruption, choosing Office components, different sizes for synced data).
    kind: guidance
  - id: odfc-not-backed-up
    says: Office container data is recoverable from its source services, so it isn't backed up or replicated.
    kind: guidance
  - id: cloud-cache-not-a-type
    says: Cloud Cache is an optional configuration of profile and ODFC containers, not a container type.
    kind: published
