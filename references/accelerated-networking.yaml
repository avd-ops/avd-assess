claims:
  - id: lower-latency-jitter-cpu
    says: Accelerated Networking bypasses the host's virtual switch, lowering latency, jitter and CPU use on the VM that has it.
    kind: published
  - id: supported-sizes
    says: Most general-purpose and compute-optimized sizes with two or more vCPUs support it, or four or more where the size has hyperthreading.
    kind: published
  - id: not-nc-nv
    says: NC and NV sizes don't support it, and enabling it on them has no effect.
    kind: published
  - id: deallocated-to-enable
    says: It can be turned on only while the VM is stopped and deallocated.
    kind: published
