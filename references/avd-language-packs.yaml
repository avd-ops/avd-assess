claims:
  - id: personal-self-service
    says: From Windows 11, users without admin rights can add a display language and its features, so personal pools don't need languages preinstalled.
    kind: published
  - id: pooled-preinstall
    says: For pooled host pools, add the languages users need to the custom image.
    kind: guidance
  - id: pool-per-language-or-shared
    says: Either one host pool with its own image per language, or one multi-language image shared by all; the shared image costs less but takes more build steps.
    kind: guidance
