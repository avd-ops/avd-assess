claims:
  - id: compliance-dashboard
    says: Use the Defender for Cloud regulatory compliance dashboard to add the compliance standards an organization follows.
    kind: guidance
  - id: metadata-geographies
    says: Where data residency applies, limit AVD workspaces, application groups and host pools to geographies that store their metadata locally.
    kind: guidance
  - id: activity-logging
    says: Collect Azure Activity, Microsoft Entra and Key Vault logs for the AVD landing zone and watch them in a SIEM.
    kind: guidance
  - id: groups-not-users
    says: Assign application groups to Entra groups rather than individual users.
    kind: guidance
