claims:
  - id: power-on-when-needed
    says: Start VM on Connect reduces cost by powering session hosts on only when a user connects; in pooled host pools it starts one host when none is on and more only when the first reaches its session limit.
    kind: guidance
  - id: slower-first-connection
    says: Connecting to a deallocated host takes longer while it powers on.
    kind: guidance
