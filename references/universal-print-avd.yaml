claims:
  - id: per-user-printers
    says: On Windows 11 multi-session 22H2 and later, Universal Print installs printers per user and they roam with a roaming profile such as FSLogix.
    kind: published
  - id: location-from-client
    says: Location-based printer search uses the client's location only when location services and location override are on in every session host.
    kind: published
  - id: older-os-issues
    says: Windows 10 and older Windows 11 hosts keep the shared-host issues (printers visible to all users, search near the VM, no roaming).
    kind: published
