claims:
  - id: RE:09
    says: Implement structured, tested and documented recovery plans that match the recovery targets and cover every component and the system as a whole.
    kind: guidance
  - id: drills-prove-targets
    says: Only production-level drills show that the plan meets its RTO and RPO; tabletop and non-production runs come first, and test results feed back into the plan.
    kind: guidance
  - id: plan-reachable-in-outage
    says: Keep recovery plans, scripts and the tools to run them where they stay available during a regional outage.
    kind: guidance
