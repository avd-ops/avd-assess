id: files-monitoring-alerts
title: Create monitoring alerts for Azure Files
url: https://learn.microsoft.com/azure/storage/files/files-monitoring-alerts
pin: "Learn git_commit_id ac4bcb1eb41ca6e2ace58e626de7d186ea80bb00, updated_at 2026-10-26"
read: 2026-10-29
license: Microsoft Learn content (link only)
areas: [assessment]
pillars: [monitoring, profiles]
notes: The storage side of E02.03 (the checklist links the Azure Files monitoring overview, which points here). The AVD-specific numbers are in ref:amba-avd#storage.
claims:
  - id: throttling
    says: Alert when a file share is throttled, from the transactions metric split by response type.
    kind: published
  - id: utilization-80
    says: Alert when a share passes 80% of its provisioned capacity, bandwidth or IOPS.
    kind: guidance
  - id: availability
    says: Alert when share availability falls below 99.9%.
    kind: guidance
  - id: per-share-needs-provisioned
    says: Pay-as-you-go shares have no per-share metrics, so a throttling alert can't say which share was throttled; provisioned shares can.
    kind: published
