claims:
  - id: default-30
    says: Analytics tables keep data for 30 days by default, except some log tables that default to 90.
    kind: published
  - id: first-31-included
    says: The first 31 days of analytics retention are included in the ingestion price, so retention below 31 days saves nothing.
    kind: published
  - id: analytics-two-years
    says: Analytics retention can be extended to two years, and total retention, with low-cost long-term storage, to twelve years.
    kind: published
