claims:
  - id: environment-coverage
    says: Every Power Platform environment running operational automation should be covered by at least one data loss prevention policy that separates business connectors from non-business and blocked connectors.
    kind: guidance
  - id: default-group-blocked
    says: Setting the default connector group to Blocked ensures newly added connectors in Power Platform are blocked until an administrator explicitly classifies them.
    kind: guidance
  - id: connector-groups
    says: Power Platform DLP policies classify connectors into Business, Non-Business and Blocked groups to prevent flows from combining operational connectors with unapproved external endpoints.
    kind: published
