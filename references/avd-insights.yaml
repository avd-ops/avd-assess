id: avd-insights
title: Enable Insights to monitor Azure Virtual Desktop
url: https://learn.microsoft.com/azure/virtual-desktop/insights
pin: "Learn git_commit_id ec0c680142f45947b0691d842131822e8708beac, updated_at 2025-06-25"
read: 2026-10-20
license: Microsoft Learn content (link only)
areas: [collection, assessment]
notes: The configuration baseline for AVD monitoring. The configuration workbook checks the same items and is the reference when a check and the workbook disagree.
claims:
  - id: hostpool-diagnostics
    says: "Host pool diagnostics send Management Activities, Feed, Connections, Errors, Checkpoints, HostRegistration and AgentHealthStatus to Log Analytics."
    kind: published
  - id: workspace-diagnostics
    says: "AVD workspace diagnostics send Management Activities, Feed, Errors and Checkpoints to Log Analytics."
    kind: published
  - id: host-data-ama-dcr
    says: Session host data needs the Azure Monitor Agent, a system-assigned managed identity and an association with a data collection rule that sends the recommended counters and event logs to Log Analytics.
    kind: published
  - id: designated-workspace
    says: Use a designated Log Analytics workspace for session hosts so only their counters and events are collected; it can differ from the diagnostics workspace.
    kind: guidance
  - id: reader-roles
    says: Viewing Insights needs Desktop Virtualization Reader on the AVD resources and Log Analytics Reader on the workspace.
    kind: published
