claims:
  - id: questionnaire
    says: The Well-Architected Review is a self-assessment of about 60 questions across the pillars, with an Azure Virtual Desktop workload variant listed under specialized reviews.
  - id: advisor-one-scope
    says: It can add Azure Advisor recommendations for one subscription or resource group only.
  - id: milestones
    says: Brownfield workloads should repeat it on a cadence (every four months is the example), tracked as milestones.
  - id: avd-workload-review
    says: Specialized reviews, an Azure Virtual Desktop workload review among them, are taken in addition to the core review, not instead of it.
