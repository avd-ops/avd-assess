claims:
  - id: hourly-billing-discount
    says: A reservation is a one- or three-year billing discount applied hourly to matching usage; it doesn't change the resources, so buy for consistent base usage.
    kind: guidance
  - id: vm-covers-compute-only
    says: A VM reservation covers compute only, not Windows software, networking or storage; Azure Files has its own capacity reservations.
    kind: guidance
  - id: exchange-and-refund
    says: Reservations can be exchanged for the same type and refunded within a yearly limit.
    kind: guidance
