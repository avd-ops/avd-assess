claims:
  - id: no-policy-default-compliant
    says: By default the tenant setting "Mark devices with no compliance policy assigned as" is Compliant, so a device with no compliance policy counts as compliant.
    kind: published
  - id: set-not-compliant-with-ca
    says: When Conditional Access uses device compliance, set devices with no compliance policy to Not compliant so only devices confirmed compliant get access.
    kind: guidance
  - id: validity-period
    says: A device that doesn't report compliance within the tenant's validity period is treated as noncompliant.
    kind: published
  - id: actions-for-noncompliance
    says: Every compliance policy marks a failing device noncompliant; more actions (notify, remote lock, retire) can follow on a schedule.
    kind: published
