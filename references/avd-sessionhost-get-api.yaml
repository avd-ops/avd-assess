id: avd-sessionhost-get-api
title: Session Hosts - Get (Desktop Virtualization REST API, 2025-10-10)
url: https://learn.microsoft.com/rest/api/desktopvirtualization/session-hosts/get
pin: "Learn git_commit_id e41049c4b677084ab48a88fd8d76c263c9df68df, updated_at 2026-03-19"
read: 2026-10-21
license: Microsoft Learn content (link only)
areas: [collection]
pillars: [diagnostics]
notes: The GA API returns each host's health check results, so a Reader can count failing checks without a host or log read.
claims:
  - id: health-check-results
    says: A session host returns sessionHostHealthCheckResults, one entry per check with its name and a result of Unknown, HealthCheckSucceeded, HealthCheckFailed or SessionHostShutdown.
    kind: published
  - id: health-check-names
    says: The check names include DomainJoinedCheck, DomainTrustCheck, DomainReachable, SxSStackListenerCheck, FSLogixHealthCheck, UrlsAccessibleCheck, MonitoringAgentCheck, MetaDataServiceCheck, AppAttachHealthCheck, WebRTCRedirectorCheck and SupportedEncryptionCheck.
    kind: published
  - id: fatal-by-name
    says: The API marks the domain, domain trust, domain reachable, stack listener, FSLogix and supported encryption checks as fatal and the monitoring agent check as non-fatal.
    kind: published
  - id: webrtc-check
    says: WebRTCRedirectorCheck verifies the component Teams uses to optimize audio and video in the session.
    kind: published
