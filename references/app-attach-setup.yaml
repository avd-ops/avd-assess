    says: Session hosts must run a supported Windows client or server OS; Windows Server 2022 and 2025 are supported from 14 April 2026.
    kind: published
  - id: packages-are-resources
    says: Each package is an Azure resource (an App Attach package) carrying its image path, version, active state, registration type and host pool assignments, readable through the management plane.
    kind: published
  - id: health-check-on-failure
    says: A package sets what the session host health check reports when it fails to stage, so a staging failure can show as host health.
    kind: published
