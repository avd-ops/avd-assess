    says: A user who signs in but sees no resources is usually not assigned to an application group, or is in a distribution group, which AVD doesn't support.
    kind: published
  - id: feed-lost-after-tenant-move
    says: Moving a subscription to another tenant loses user assignments; reassign the users, and re-register the resource provider for a subscription a partner created.
    kind: published
