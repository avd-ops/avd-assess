claims:
  - id: deprecated
    says: The page is deprecated, no longer updated, and is to be removed from Learn on 2026-10-30.
    kind: published
  - id: temporary-workers
    says: AVD can give temporary workers a standard way into corporate apps and data, deployed and shut down quickly, without shipping or managing devices.
    kind: guidance
  - id: latency-sensitive-apps
    says: For apps that need short round trips between client and server, hosting the desktop in Azure next to the app's server gives a lower-latency path than a VPN over a public network.
    kind: guidance
  - id: secure-environments
    says: Where corporate data must not be stored on physical devices, AVD keeps the desktop, apps and data inside the corporate environment, so a lost device carries none of them.
    kind: guidance
