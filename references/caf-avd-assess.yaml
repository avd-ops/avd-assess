notes: Microsoft is removing the whole CAF AVD scenario on 2026-10-30, so the pin is the public GitHub copy. On 2026-10-20 the Well-Architected AVD workload guide pages already redirected to the product overview, while the AVD workload review stayed live. Still the only Microsoft page listing the questions an AVD assessment answers.
claims:
  - id: unit-of-assessment
    says: Each assessment covers one combination of persona, host pool, applications and data, and user profiles, and answers its questions from data.
  - id: persona-criteria
    says: Personas come from bucketing users by pooled or personal need, density, performance, GPU, region, business function, user count and peak concurrent sessions.
  - id: density-defaults
    says: Its worked example assumes six light users per vCPU, two heavy users per vCPU and 4 GB of RAM per vCPU.
  - id: application-questions
    says: For each persona, list the required apps and ask whether they need a custom image, Microsoft 365 Apps, a personal pool for multi-session incompatibility, or a back end moved closer for latency.
  - id: poc-default-sizes
    says: The proof of concept uses default VM sizes; assessment data then replaces those defaults before production.
