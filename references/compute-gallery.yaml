claims:
  - id: two-galleries-for-dr
    says: The gallery isn't a global resource; for disaster recovery keep at least two galleries in separate regions, because a gallery's region going down stops new or updated gallery resources.
    kind: published
  - id: zrs-replicas
    says: Use zone-redundant storage for image versions where the region supports it, and keep at least three replicas of production images, one more for every 20 VMs created at once.
    kind: guidance
  - id: replicate-per-version
    says: Each image version is replicated to the regions chosen for it, and replication can take hours; a version is usable in a region only once its replication there completes.
    kind: published
