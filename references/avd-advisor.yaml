claims:
  - id: validation-pool
    says: Advisor flags a subscription with no host pool in a validation environment.
    kind: published
  - id: production-majority
    says: Advisor flags a subscription where half or more of the host pools are validation pools, or none is production.
    kind: published
  - id: required-urls
    says: Advisor flags session hosts that can't reach the required URLs.
    kind: published
  - id: twice-a-day
    says: Advisor refreshes twice a day, so a fixed setting clears from its list with a delay; letting it clear on its own is preferred to dismissing it.
    kind: guidance
