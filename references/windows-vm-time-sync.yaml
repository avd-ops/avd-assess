notes: Baseline reference for Windows Time Service (W32Time) behavior on Azure VMs and AVD session hosts.
claims:
  - id: azure-vm-time-sources
    says: Azure Windows VMs can sync via host time (VMICTimeProvider), time.windows.com (NTP), or a domain hierarchy (NT5DS), while Azure hosts pull from Stratum 1 GPS-backed servers.
    kind: published
  - id: ad-domain-hierarchy
    says: Active Directory domain-joined VMs should follow the AD DS time hierarchy (NT5DS) rather than time.windows.com or host-only sync.
    kind: guidance
  - id: host-only-avd
    says: Host-only sync (VMICTimeProvider) avoids outbound public NTP traffic and is suited to environments such as Azure Virtual Desktop when not domain-joined.
    kind: guidance
