claims:
  - id: pooled-only
    says: Autoscale data in Insights is for pooled host pools only; personal host pools send autoscale logs to a storage account or an event hub.
    kind: published
  - id: hostpool-category
    says: The host pool's diagnostic setting needs the autoscale category for pooled host pools, sent to the same workspace as its other logs.
    kind: published
  - id: evaluation-table
    says: Each autoscale evaluation is a row with the phase, the configured threshold and minimum, session occupancy, active and unhealthy host counts and the result; failed ones join to the errors table by correlation ID.
    kind: published
