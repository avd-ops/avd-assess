notes: The checklist's link for C01.01, C01.02 and C01.06.
claims:
  - id: remoteapp-pooled-only
    says: RemoteApp application groups are available on pooled host pools only.
    kind: published
  - id: one-desktop-group
    says: A host pool has at most one desktop application group and may have several RemoteApp groups; a user in several RemoteApp groups on one pool sees all their apps.
    kind: published
  - id: preferred-type-hides-other
    says: A user given both a desktop and a RemoteApp group on the same pool sees only the pool's preferred application group type.
    kind: published
  # Claims read for the capacity and images pillars (2026-10-21) at the same pin.
  - id: same-image-per-pool
    says: All session hosts in a host pool should come from the same image, for a consistent user experience.
    kind: guidance
  - id: pooled-vs-personal
    says: Personal pools give each user an assigned host for performance and data separation; pooled pools load-balance users across shared hosts for lower cost.
    kind: published
