claims:
  - id: re-register-provider
    says: Each subscription used with Private Link needs the Microsoft.DesktopVirtualization resource provider re-registered first.
    kind: published
  - id: dns-zones
    says: Connection and feed endpoints resolve through the privatelink.wvd.microsoft.com zone and the global endpoint through privatelink-global.wvd.microsoft.com.
    kind: published
  - id: client-versions
    says: Any platform's Remote Desktop app works; the Remote Desktop client for Windows needs version 1.2.4066 or later, and Windows App on macOS and iOS/iPadOS is supported.
    kind: published
  - id: shortpath-with-private-link
    says: Public-network Shortpath (STUN and TURN) is not supported with Private Link; managed-network Shortpath is, with the UDP opt-in.
    kind: published
