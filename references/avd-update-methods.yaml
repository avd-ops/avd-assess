id: avd-update-methods
title: Windows update management methodologies for Azure Virtual Desktop session hosts
url: https://learn.microsoft.com/azure/virtual-desktop/windows-update-management-methodologies-session-hosts
pin: "Learn git_commit_id de6e2325bea5c22de746080fb3965dbf1b277e5a, updated_at 2026-10-28"
read: 2026-10-29
license: Microsoft Learn content (link only)
areas: [assessment]
claims:
  - id: method-by-os
    says: The recommended update method depends on the session host OS (Enterprise, multi-session or Server), the kind of update and the servicing model (patch in place or image-based).
    kind: guidance
  - id: multisession-image-based
    says: For multi-session hosts, monthly and feature updates are recommended through session host update or new Azure Compute Gallery image versions; Windows Update and Autopatch are not recommended.
    kind: published
  - id: server-update-manager
    says: For Windows Server session hosts, Azure Update Manager and automatic guest patching are the recommended monthly update methods.
    kind: published
  - id: pooled-image-servicing
    says: Image-based servicing through session host update is recommended for pooled host pools; it keeps hosts consistent and eases rollback.
    kind: published
  - id: hotpatch
    says: Hotpatch applies eligible monthly security updates without a reboot on Windows Server Azure Edition and Windows 11 Enterprise 24H2 or later with VBS on; multi-session isn't supported.
    kind: published
