areas: [assessment]
claims:
  - id: sse-always-on
    says: Server-side encryption encrypts managed disks at rest by default, but not temp disks or disk caches.
    kind: published
  - id: encryption-at-host
    says: Encryption at host adds temp disks, caches and the data flow to storage, without using the VM's CPU.
    kind: published
  - id: ade-retirement
    says: Azure Disk Encryption retires on 2028-09-15; new VMs should use encryption at host, and ADE VMs must migrate before then.
    kind: published
  - id: customer-keys
    says: Customer-managed keys are available through a disk encryption set for server-side encryption and encryption at host.
    kind: published
