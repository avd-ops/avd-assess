id: avd-multiregion-bcdr
title: Multiregion BCDR for Azure Virtual Desktop
url: https://learn.microsoft.com/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
pin: "Learn git_commit_id d6054b5b6a0fda90d06619b94a3c5c2ce89c4513, updated_at 2026-10-05"
read: 2026-10-20
license: Microsoft Learn content (link only)
areas: [assessment, benchmarks]
claims:
  - id: active-active-vs-passive
    says: Each pooled host pool takes an active-active model (a second pool in another region serving users, near-zero RTO, no failover step) or active-passive (a standby pool users are moved to by reassigning application groups).
    kind: guidance
  - id: estimates-to-test
    says: The recovery time and data loss figures per model are estimates to validate by disaster recovery testing.
    kind: prior
  - id: one-pool-at-a-time
    says: Users must use only one host pool at a time to avoid profile conflicts; fail over every application group together.
    kind: published
  - id: cloud-cache-over-storage-replication
    says: Use FSLogix Cloud Cache rather than storage replication for profiles across regions; Premium Azure Files has no geo-redundant storage.
    kind: published
  - id: cache-disk-sizing
    says: Size the Cloud Cache local disk at least as large as the largest profile, starting from about 30 GB per concurrent user on Premium disks.
    kind: prior
  - id: capacity-not-guaranteed
    says: Deallocated hosts and new deployments in the recovery region don't have guaranteed capacity; only running resources or on-demand capacity reservations do.
    kind: published
  - id: image-in-both-regions
    says: Replicate the gallery image to both regions so both pools deploy the same golden image.
    kind: guidance
  - id: selective-failover-test
    says: Test failover by moving a subset of users or application groups to the secondary pool.
    kind: guidance
  # Claims read for the reliability pillar (2026-10-21), at the same pin.
  - id: zones-not-dr
    says: Availability zones are a high availability feature; don't treat them as disaster recovery for a region-wide event.
    kind: published
  - id: spread-and-overprovision
    says: Spread session hosts across zones (an availability set where the region has none) and consider extra hosts so the pool still serves users with one zone lost.
    kind: guidance
  - id: dependencies-zone-resilient
    says: Review each dependency for a single zone outage, for example domain controllers, gateways and other resources users reach, and deploy them across zones.
    kind: guidance
  - id: networking-in-both-regions
    says: Before multiregion recovery, deploy the landing zone in both regions, each spoke on a hub in its own region with connectivity between the hubs, and confirm line-of-business apps and dependent resources are available in the recovery region.
    kind: guidance
  - id: personal-site-recovery
    says: Personal host pools recover with Site Recovery per VM, failed over and back by an administrator at the VM level; VM extensions aren't kept and must be set up again.
    kind: published
  - id: no-asr-test-failover
    says: Don't use Site Recovery test failover for session hosts, because the duplicate VM registers with the control plane and conflicts with the original; start secondary hosts on a schedule and run the failover procedure with a test group instead.
    kind: published
  - id: rto-rpo-by-model
    says: Microsoft's estimates are near-zero RTO for active-active, 15 to 60 minutes for active-passive with Cloud Cache (RPO seconds to minutes), and an RPO of 5 to 15 minutes for personal pools with Site Recovery.
    kind: prior
  - id: token-refresh-90-days
    says: Each standby session host must start for a few hours at least every 90 days to refresh its control plane token.
    kind: published
  - id: log-workspace-per-region
    says: One Log Analytics workspace for both regions gives one view but is lost to the recovery region if the primary fails; a workspace per region or workspace replication avoids that.
    kind: guidance
  - id: premium-files-no-grs
    says: Premium Azure Files has no geo-redundant storage, so profiles needing Premium performance rely on Cloud Cache for cross-region copies.
    kind: published
  - id: anf-zone-or-region
    says: The guide treats Azure NetApp Files cross-zone and cross-region replication as mutually exclusive per volume, and failover as not transparent.
    kind: published
  - id: msix-account-per-region
    says: Keep App Attach and MSIX packages in their own storage account in each region, zone-redundant at least in the primary, with every package copied to and registered in both pools.
    kind: guidance
  - id: identity-in-recovery-region
    says: Entra ID needs no recovery action; AD DS needs domain controllers in the recovery region with DNS and global catalog roles, Entra Connect a staging server there, and Domain Services a replica set.
    kind: guidance
  - id: office-container-no-backup
    says: Office containers that hold only cached Microsoft 365 data needn't be backed up; separate them from profile containers to give each its own backup policy.
    kind: guidance
  - id: back-up-primary-only
    says: Back up primary region storage; the recovery environment usually needs no backup of its own. The vault uses ZRS unless an offsite or cross-region copy is needed, then GRS.
    kind: guidance
  - id: automate-and-align
    says: Automate failover, test the full failover and failback periodically, and check regularly that the two regions' host pools stay aligned.
    kind: guidance
