id: avd-sso
title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
url: https://learn.microsoft.com/azure/virtual-desktop/configure-single-sign-on
pin: "Learn git_commit_id 9e91f2c9068a0844f3041110ca90b6a25540b566, updated_at 2026-07-29"
read: 2026-10-21
license: Microsoft Learn content (link only)
areas: [assessment, collection]
pillars: [identity]
notes: Single sign-on has a host pool half (an RDP property, readable from the control plane) and a tenant half (a setting on the Windows Cloud Login service principal and the trusted device groups, which only a directory read sees).
claims:
  - id: join-types
    says: Single sign-on needs Entra joined or Entra hybrid joined hosts; hosts joined only to AD DS or to Entra Domain Services aren't supported.
    kind: published
  - id: two-way-trust
    says: Hybrid joined hosts in a different domain from the users need a two-way trust, or connections fall back to older authentication.
    kind: published
  - id: tenant-rdp-enabled
    says: The tenant must allow Entra authentication for Windows by turning on the Remote Desktop protocol setting of the Windows Cloud Login service principal.
    kind: published
  - id: consent-prompt
    says: Users see a consent prompt for each new host, remembered for up to 15 hosts and 30 days, unless the hosts are in a trusted device group on the service principal.
    kind: published
  - id: kerberos-server-object
    says: A Kerberos server object is needed for hybrid joined hosts, and for Entra joined hosts that must reach on-premises resources where domain controllers exist.
    kind: published
  - id: host-pool-property
    says: The host pool turns single sign-on on with the Entra authentication RDP property.
    kind: published
  - id: disconnect-on-lock
    says: With single sign-on a locked session disconnects by default instead of showing the remote lock screen.
    kind: published
