claims:
  - id: domain-join-errors
    says: Hosts that didn't join the domain fail on credentials, permissions, DNS that can't resolve the domain, or blocked computer account reuse.
    kind: published
  - id: install-scriptlog
    says: A missing agent and boot loader with no ScriptLog.log under the Windows temp folder means the installer never ran in the security context it was given.
    kind: published
  - id: isregistered-zero
    says: An agent registry value IsRegistered of zero means the registration token expired.
    kind: published
  - id: no-heartbeat
    says: A host that reports no heartbeat has a stopped boot loader service or can't reach the broker on port 443.
    kind: published
  - id: reverse-connect-stack-failure
    says: O_REVERSE_CONNECT_STACK_FAILURE means the side-by-side stack isn't installed on the host.
    kind: published
