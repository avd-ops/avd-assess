id: review-checklists-avd
title: Azure review checklists, Azure Virtual Desktop
url: https://github.com/Azure/review-checklists
pin: https://github.com/Azure/review-checklists/blob/f131b93418892102b00c247fd9cf685e3d356522/checklists/avd_checklist.en.json
read: 2026-10-20
license: MIT
areas: [assessment]
notes: 130 items with short ID, category, WAF pillar, severity and Learn link. The AVD items have no Resource Graph query, so mapping evidence to them is ours (gap:checklist-mapping). Cite items by short ID, never by GUID.
claims:
  - id: A01.06
    says: Prepare a local disaster recovery strategy for personal host pool session hosts (Reliability, medium).
  - id: A03.05
    says: Use zone-redundant storage for Azure Files to maximize resiliency (Reliability, high).
  - id: C01.05
    says: Session host VMs in pooled host pools shouldn't have more than 32 cores (Performance, medium).
  - id: C01.06
    says: Don't offer both full desktops and RemoteApps to the same users from the same host pool (Security, high).
  - id: E01.05
    says: Consider Start VM on Connect for personal host pools (Cost, low).
  - id: E01.10
    says: Configure scheduled agent updates (Reliability, low).
  - id: E01.11
    says: Create a validation (canary) host pool (Operations, medium).
  - id: E01.13
    says: Turn session host VMs on at least every 90 days so their tokens refresh (Operations, medium).
  - id: E02.01
    says: Enable monitoring for Azure Virtual Desktop (Reliability, high).
  - id: E02.02
    says: Send diagnostic settings for workspaces, host pools, application groups and host VMs to a Log Analytics workspace (Reliability, medium).
  - id: F01.10
    says: Evaluate a private endpoint for the Azure Files share (Security, medium).
  - id: F01.11
    says: Evaluate RDP Shortpath for clients on managed internal networks (Performance, medium).
  - id: H03.05
    says: Keep the FSLogix profile storage in the same Azure region as the session hosts (Performance, high).
  - id: H04.03
    says: Review and confirm the configured maximum FSLogix profile size (Cost, high).
  # Items read for the deployment dimension register (dimensions.yaml, 2026-10-20); kept here, after the others, so the list grows without reordering.
  - id: A01.04
    says: Plan the best resiliency option for the host pool deployment (Reliability, high).
  - id: A03.02
    says: Build a backup protection strategy for profile and Office containers (Reliability, medium).
  - id: B01.03
    says: Determine which OS images to use for host pool deployment (Reliability, medium).
  - id: B01.07
    says: Include the latest FSLogix version in the golden image update process (Reliability, high).
  - id: B01.08
    says: Evaluate the desktop optimization tool for the image (Performance, low).
  - id: B01.10
    says: Determine whether Microsoft Teams will be part of the deployment (Performance, low).
  - id: B03.01
    says: Evaluate Gen2 VMs for host pool deployment (Performance, medium).
  - id: B03.02
    says: Consider multimedia redirection for better browser video performance (Performance, low).
  - id: C01.04
    says: For pooled host pools, select the best load balancing method (Performance, low).
  - id: C01.10
    says: Run a workload performance test to determine the best VM SKU and size (Performance, high).
  - id: C01.12
    says: Determine whether session hosts need a GPU (Performance, low).
  - id: C01.13
    says: Use VM SKUs that support Accelerated Networking (Performance, low).
  - id: C03.03
    says: Check quotas and availability for the VM sizes and types in the chosen regions (Reliability, low).
  - id: E01.03
    says: Evaluate Intune for session host management (Operations, medium).
  - id: E01.09
    says: Plan an emergency patching and update strategy for session hosts (Operations, medium).
  - id: E02.03
    says: Alert on profile storage high usage and throttling (Reliability, medium).
  - id: F01.09
    says: Check the network bandwidth needed per user and in total for the VM SKU (Performance, low).
  - id: H01.02
    says: Enable SMB multichannel on premium file shares that hold FSLogix profiles (Performance, low).
  - id: H03.01
    says: Determine which managed disk type session hosts will use (Performance, medium).
  - id: H03.02
    says: Determine the storage backend for FSLogix profiles (Performance, high).
  - id: H03.04
    says: Verify storage scalability limits against host pool requirements (Reliability, high).
  - id: H04.06
    says: With FSLogix Cloud Cache, consider putting the cache on the VM's temporary drive (Performance, low).
  # Cost items read for methods/finops.md (2026-10-20); kept here, after the others, so the list grows without reordering.
  - id: C01.01
    says: Determine the host pool type to use (Cost, high).
  - id: E01.04
    says: Assess the requirements for host pool autoscaling (Reliability, medium).
  - id: E01.06
    says: Evaluate an ad-hoc mechanism to shut down personal session hosts (Cost, low).
  - id: E01.07
    says: Review and adopt the suggested tags for Azure Virtual Desktop (Cost, low).
  - id: H04.07
    says: Review the use of FSLogix redirections (Cost, medium).
  # Security items read for methods/security.md (2026-10-20); kept here, after the others, so the list grows without reordering.
  - id: D02.01
    says: Configure the Azure Files share for Entra Kerberos authentication on Entra joined hosts (Security, medium).
  - id: F01.04
    says: Decide whether to control or restrict internet outbound traffic from session hosts (Security, medium).
  - id: G01.01
    says: Secure RDP sessions with policy (idle and disconnect limits, screen lock) (Security, medium).
  - id: G02.01
    says: Run anti-virus and anti-malware on session hosts (Security, high).
  - id: G02.02
    says: Assess disk encryption requirements for session hosts (Security, low).
  - id: G02.03
    says: Enable Trusted launch on Gen2 session hosts (Security, medium).
  - id: G02.04
    says: Trusted launch and a Gen2 image are requirements for Windows 11 (Security, high).
  - id: G02.05
    says: Consider screen capture protection for sensitive information (Security, low).
  - id: G02.06
    says: Restrict device redirection and drive mapping (Security, medium).
  - id: G03.03
    says: Users have no local administrator rights on session hosts (Security, high).
  - id: G03.04
    says: Enable Defender for Cloud for session host security posture (Security, medium).
  - id: G03.05
    says: Enable diagnostic and audit logging (Security, medium).
  - id: G03.06
    says: Assess whether custom RBAC roles are needed for AVD management (Security, low).
  - id: G03.07
    says: Restrict users from installing unauthorized applications (Security, medium).
  - id: G04.01
    says: Evaluate MFA and Conditional Access for AVD users (Security, medium).
  - id: G05.01
    says: Review and apply Zero Trust principles (Security, medium).
  - id: H04.02
    says: Configure the recommended antivirus exclusions for FSLogix (Security, medium).
  - id: F01.01
    says: Decide whether host pools need hybrid connectivity to on-premises (Reliability, medium).
  - id: F01.02
    says: Decide which virtual network each host pool goes in (Performance, medium).
  - id: F01.03
    says: List the on-premises resources host pools need to reach (Reliability, medium).
  - id: F01.05
    says: Make sure session hosts can reach the AVD control plane endpoints (Reliability, high).
  - id: F01.06
    says: Decide whether to control internet outbound traffic only for users on the hosts (Security, medium).
  - id: F01.07
    says: Review custom routes and NSGs on host pool subnets (Security, low).
  - id: F01.08
    says: No proxy, SSL termination or deep packet inspection for AVD control plane traffic (Reliability, high).
  - id: C02.04
    says: Run a proof of concept to validate end-to-end user experience and the effect of network latency (Performance, high).
