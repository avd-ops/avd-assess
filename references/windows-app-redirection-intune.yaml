claims:
  - id: per-device-redirection
    says: Intune app configuration policies can set redirection per user group, platform and managed or personal device, on top of the host pool settings.
    kind: published
  - id: more-restrictive-wins
    says: When client and host pool settings differ, the more restrictive one applies.
    kind: published
  - id: not-a-substitute
    says: Client-side settings don't replace host pool and session host settings; higher-security workloads set redirection on the host side and use data loss prevention.
    kind: guidance
