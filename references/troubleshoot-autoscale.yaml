claims:
  - id: role-scope-containing-pool
    says: The power on and off role on the host pool, its resource group or the subscription is enough for autoscale to start and stop hosts.
    kind: published
  - id: required-hosts-formula
    says: In ramp-down and off-peak, autoscale keeps the higher of the minimum percentage of hosts and the sessions, disconnected included, divided by the session limit times the capacity threshold, rounded up.
    kind: published
