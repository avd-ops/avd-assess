areas: [collection, benchmarks]
claims:
  - id: counter-set
    says: Insights collects 20 performance counters, most every 30 seconds and five every 60 seconds, each multiplied per VM, core, disk, session or process.
    kind: published
  - id: event-logs
    says: "Insights collects six event logs: Application, System, two Terminal Services logs and the two FSLogix logs."
    kind: published
  - id: per-vm-estimate
    says: An example host ingests about 92 to 145 MB a day, roughly 3 to 5 GB every 31 days; counters are 80 to 99% of it.
    kind: published
  - id: keep-diagnostics
    says: AVD diagnostics are under 1% of the cost and shouldn't be removed; trim counters first.
    kind: guidance
