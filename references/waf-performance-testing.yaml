areas: [assessment, benchmarks]
claims:
  - id: baseline-defined
    says: A performance baseline is the set of metrics that shows the workload's behavior under normal conditions, validated by testing.
    kind: guidance
  - id: regression-and-drift
    says: A regression is a decline against the baseline caused by a change; drift is a gradual decline that goes unnoticed without regular tests against the baseline.
    kind: guidance
  - id: hypothesis-baseline-variant
    says: State a prediction with measurable success criteria, run the same test against the baseline and the variant, and compare the results.
    kind: guidance
  - id: record-baselines
    says: Record metrics from the first tests as baselines, and use them to tell whether an optimization helped.
    kind: guidance
  - id: production-baselines
    says: Testing in production shows what only real users and data reveal and gives accurate baselines for later optimization.
    kind: guidance
