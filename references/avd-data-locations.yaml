claims:
  - id: geographical-default
    says: By default a host pool's deployment scope is geographical, and its metadata is stored in the geography of the region chosen, with no dependency on that region.
    kind: published
  - id: regional-scope
    says: A regional deployment scope keeps the metadata of the host pool and its service objects in one region, where the region offers it; elsewhere host pools are geographical.
    kind: published
  - id: arm-paths-outside
    says: Resource Manager paths count as organizational information, not customer data, and are stored outside the chosen geography.
    kind: published
  - id: no-user-data
    says: The service stores object names, VM names and user principal names, but no user documents or app data.
    kind: published
