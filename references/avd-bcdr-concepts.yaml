claims:
  - id: customer-managed-components
    says: Session hosts, profile management, applications, user data and user identities are the customer's or partner's to make resilient; the rest is Microsoft's.
    kind: published
  - id: no-native-dr
    says: AVD has no native disaster recovery features; recovery is built from other Azure services such as zones, availability sets, Site Recovery and storage redundancy.
