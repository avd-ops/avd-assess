claims:
  - id: managed-udp-only
    says: QoS policies apply only to Shortpath for managed networks, never to the TCP reverse connect transport.
    kind: published
  - id: dscp-46
    says: Mark RDP packets on the hosts with DSCP 46 (Expedited Forwarding), and apply the same markings end to end.
    kind: guidance
  - id: qos-before-bandwidth
    says: To fix jitter, loss and delay, apply QoS first and add bandwidth only where needed.
    kind: guidance
