  - id: three-log-types
    says: FSLogix writes event logs, text log files and trace files; a support tool gathers them into one archive.
    kind: published
  - id: event-log-location
    says: FSLogix event logs are under Applications and Services Logs, FSLogix, in Admin and Operational logs for Apps and for Cloud Cache.
    kind: published
  - id: profile-log-first
    says: The text logs under ProgramData, FSLogix, Logs are the first place to look, the daily Profile log above all, and each warning and error carries a code.
    kind: published
  - id: kerberos-rc4-change
    says: Shares not moved to AES-SHA1 Kerberos encryption may lose profile access after the April 2026 Windows Server update changes the default from RC4.
    kind: published
