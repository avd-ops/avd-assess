notes: Written for AVD on Azure Local, but its comparison of single-session and multi-session hosts holds for Azure-hosted session hosts too; we cite only that comparison.
claims:
  - id: workload-types-examples
    says: The light, medium, heavy and power workload types are examples only; test a deployment with load simulation and real-life usage.
    kind: guidance
  - id: single-session-when
    says: Single-session hosts suit work that needs consistent performance, heavy apps, or per-user customization and installs, at a higher cost per user.
    kind: guidance
  - id: multi-session-when
    says: Multi-session hosts suit standard apps and lighter work, such as task workers, with customization limited and managed centrally to keep every user stable.
    kind: guidance
