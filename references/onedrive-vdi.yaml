claims:
  - id: silent-config-and-kfm
    says: Silent account configuration signs users in to OneDrive automatically on virtual desktops, and Known Folder Move redirects Desktop, Documents and Pictures into OneDrive so user files survive outside the profile container.
    kind: published
  - id: files-on-demand-vdi
    says: Files On-Demand is supported on Windows 10 and Windows 11 virtual desktops with FSLogix profile containers and keeps un-opened files online-only so they do not bloat the profile VHDX.
    kind: published
  - id: per-machine-install
    says: On virtual desktops shared by multiple users, install the OneDrive sync app per machine (/allusers) in the image.
    kind: published
