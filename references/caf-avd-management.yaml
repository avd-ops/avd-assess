claims:
  - id: insights-config-workbook
    says: Configure diagnostics, events and counters through Insights, and use its configuration workbook to stay current when new settings are required.
    kind: guidance
  - id: regional-workspace
    says: Use one Log Analytics workspace for the AVD platform and hosts, in the region of the session hosts.
    kind: guidance
  - id: alerting-model
    says: Set up an alerting model for the collected logs and metrics.
    kind: guidance
  - id: long-retention-export
    says: Send diagnostics to a storage account when retention must go beyond two years.
    kind: guidance
