claims:
  - id: app-protection-for-clients
    says: Intune app protection policies with Conditional Access can require that the client device meets security conditions before connecting to AVD, on iOS and iPadOS and Android (managed or unmanaged) and in Edge on Windows (unmanaged only); ChromeOS isn't covered.
    kind: published
  - id: redirection-needs-compliance
    says: Managing local device redirection (camera, microphone, storage, clipboard) from Intune on iOS and Android requires client device security compliance first.
    kind: published
  - id: filters-managed-unmanaged
    says: Assignment filters let different requirements apply to managed and unmanaged client devices; without a filter the same requirements apply to both.
    kind: published
