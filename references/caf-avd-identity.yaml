claims:
  - id: ou-per-host-pool
    says: Put each host pool's session hosts in their own Active Directory OU to keep policy simple and orphaned objects easy to find.
    kind: guidance
  - id: non-interactive-join-account
    says: The domain join account must not need MFA or any interactive prompt.
    kind: guidance
  - id: entra-ds-limits
    says: Entra Domain Services needs password hash sync and doesn't allow hybrid join of the hosts.
    kind: guidance
  - id: laps
    says: Rotate session hosts' local administrator passwords with a solution like LAPS.
    kind: guidance
  - id: groups-not-users
    says: Assign Desktop Virtualization User to security groups, not to individual users.
    kind: guidance
