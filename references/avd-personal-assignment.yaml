claims:
  - id: one-to-one
    says: A personal desktop maps to one user, and every sign-in goes to that user's host.
    kind: published
  - id: automatic-default
    says: Automatic assignment, the default for new personal pools, gives a user any free desktop at first connection; direct assignment names the host before the user connects.
    kind: published
  - id: reassign
    says: A personal desktop can be reassigned to another user through the portal or the REST API, not the CLI.
    kind: published
  - id: fslogix-multiple-connections
    says: With FSLogix and one profile container location for a personal pool, allow multiple connections to the container to avoid errors.
    kind: published
