notes: The page's settings are the published baseline for tuning antivirus on multi-session and non-persistent hosts. It gives no measured overhead per user.
claims:
  - id: vdi-settings
    says: The page lists recommended antivirus settings for VDI that balance protection and performance (randomized scans, headless UI, cloud protection and others).
    kind: published
  - id: cache-maintenance-before-seal
    says: Run the Defender cache maintenance task on the image before sealing it, or each VM can see higher CPU while it runs.
    kind: published
  - id: shared-updates
    says: Security intelligence updates can come from a dedicated VDI file share instead of each VM downloading them.
    kind: guidance
