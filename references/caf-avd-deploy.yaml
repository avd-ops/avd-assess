claims:
  - id: persona-iterations
    says: Each persona is likely its own iteration and host pool; breaking deployment into persona-driven iterations limits the change the business absorbs at once.
    kind: guidance
  - id: legacy-apps-personal
    says: Personas that depend on apps that aren't multi-session compatible may need dedicated desktops, and this is sometimes found only in testing.
    kind: guidance
  - id: app-remediation-blocks
    says: Some apps need remediation, modernization or a move to Azure first; when latency would hurt the business, that can block a persona's migration.
    kind: guidance
