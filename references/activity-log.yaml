    says: Activity log entries are kept for 90 days and then deleted; the activity log is the only record of who created a resource.
    kind: published
  - id: export-by-diagnostic-setting
    says: A diagnostic setting sends the activity log to a Log Analytics workspace, storage or Event Hubs for longer retention.
    kind: published
