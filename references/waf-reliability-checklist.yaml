claims:
  - id: RE:04
    says: Define reliability and recovery targets and use them as the base of the health model.
  - id: RE:05
    says: Add redundancy at several levels, especially for critical flows.
  - id: RE:06
    says: Scale on actual or predicted usage with little manual intervention.
