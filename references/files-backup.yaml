claims:
  - id: snapshot-and-vaulted
    says: Azure Files backup has a snapshot tier, whose share snapshots stay in the storage account, and a vaulted tier, which keeps an offsite copy in the vault.
    kind: published
  - id: vaulted-survives-source-loss
    says: Only the vaulted tier protects against loss of the source account itself, with no dependency on the source data being available.
    kind: published
  - id: soft-delete-enabled
    says: Configuring backup turns on file share soft delete for the storage account, which keeps a deleted share and its snapshots for a retention period.
    kind: published
