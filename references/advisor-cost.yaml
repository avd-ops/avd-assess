notes: The list of Advisor's cost recommendations. Each has a recommendation ID on the page; we cite by our claim ID only. The method reads Advisor's results as evidence and doesn't recompute them (gap:finops-scope).
claims:
  - id: right-size-or-shutdown-vms
    says: Advisor flags virtual machines with low usage to resize or shut down, and notes that some low use is by design.
    kind: guidance
  - id: unattached-disks
    says: Advisor lists managed disks not attached to a VM for review (preview).
    kind: guidance
  - id: vm-reservations
    says: Advisor recommends VM reservations from usage over a look-back period, estimated per subscription.
    kind: guidance
  - id: savings-plan
    says: Advisor recommends a savings plan commitment from recent eligible usage.
    kind: guidance
