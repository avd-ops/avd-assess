notes: Deprecated; Microsoft removes it on 2026-10-30. Three claims have no living source yet (no-financial-sla, availability-option-at-create, hosts-stateless-no-vm-backup); when the page goes, each moves to a living source or becomes a gap (gap:reliability-scope).
claims:
  - id: no-financial-sla
    says: Microsoft offers no financially backed SLA for the AVD service itself and aims for at least 99.9 percent availability of its URLs; the hosts' own SLA follows from their availability option and disks.
    kind: published
  - id: availability-option-at-create
    says: A VM's availability option is chosen at creation and can't be changed later, so the pool's resiliency option is a build-time decision.
    kind: published
  - id: separate-critical-apps
    says: Decide which applications are critical and consider separate host pools for them, each with its own recovery approach.
    kind: guidance
  - id: hosts-stateless-no-vm-backup
    says: Pooled hosts should be stateless, so backing up their VM state isn't recommended even though it is supported.
    kind: guidance
  - id: assess-what-to-protect
    says: Assess which profile and Office container data needs protecting; with OneDrive or another external store it may need none.
    kind: guidance
  - id: dependencies-in-recovery-region
    says: Network, hybrid connectivity and Active Directory authentication must be available in the recovery region, and dependent applications need their own recovery plans.
    kind: guidance
