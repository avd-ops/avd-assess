id: azure-mcp
title: Azure MCP Server tools for Azure Virtual Desktop and server startup modes
url: https://learn.microsoft.com/azure/developer/azure-mcp-server/tools/azure-virtual-desktop
pin: "Learn git_commit_id 7c4a91e2b803f512d4a96c1830e7b42f9a51c308, updated_at 2026-10-20"
read: 2026-11-08
license: Microsoft Learn content (link only)
areas: [collection, assessment]
pillars: [monitoring, diagnostics, security-posture]
notes: "Microsoft's Azure MCP Server (`microsoft/mcp`, MIT) startup parameters (`--mode all`, `--read-only`, `--namespace virtualdesktop`), verified typed AVD read tools (`virtualdesktop_hostpool_list`, `virtualdesktop_hostpool_host_list`, `virtualdesktop_hostpool_host_user-list`), and comparison against CLI wrapper MCP servers (`Azure/azure-api-mcp`, MIT) for collection vs. investigation."
claims:
  - id: read-only-flag
    says: "Starting the Azure MCP Server with `--read-only` exposes only tools annotated read-only (`readOnlyHint` set to `true`) and refuses write operations across exposed namespaces."
    kind: published
  - id: all-mode-per-tool-allowlist
    says: "The default `namespace` mode exposes one aggregated tool per service namespace; starting the Azure MCP Server with `--mode all` (or naming tools with `--tool`) exposes individual tool schemas so a caller can enforce a per-tool allowlist and bound prompt token overhead."
    kind: published
  - id: typed-vs-cli-wrapper
    says: "The Azure MCP Server's `virtualdesktop` namespace exposes three typed, read-only tools (`virtualdesktop_hostpool_list`, `virtualdesktop_hostpool_host_list`, and `virtualdesktop_hostpool_host_user-list`), whereas `Azure/azure-api-mcp` (`--readonly`) wraps free-form `az` CLI commands for ad-hoc exploration; deterministic collectors and test harnesses run direct PowerShell or Bicep without MCP."
    kind: guidance
