claims:
  - id: service-updates-first
    says: A validation host pool receives service updates before the rest, and Microsoft highly recommends having one.
    kind: guidance
  - id: like-production
    says: Keep the validation pool as close to production pools as possible, used as often, with the same automated tests.
    kind: guidance
  - id: test-only
    says: Leave the validation pool in place for every future update and use it only for testing, never for production.
    kind: guidance
