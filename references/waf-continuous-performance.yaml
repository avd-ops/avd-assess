claims:
  - id: over-and-under
    says: Performance efficiency means capacity matches actual use; overperformance costs money and underperformance hurts users, so both are findings.
    kind: guidance
  - id: test-before-and-after
    says: Review metrics regularly, adjust, and test every change before and after it is made against the performance targets.
    kind: guidance
  - id: deviation-thresholds
    says: Make performance targets, baselines and deviation thresholds (how far from the baseline is acceptable) visible to the team.
    kind: guidance
