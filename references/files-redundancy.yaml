claims:
  - id: zrs-for-availability
    says: ZRS keeps a share readable and writable through a zone loss without remounting, and is recommended in the primary region where high availability matters.
    kind: published
  - id: ssd-no-geo
    says: SSD (premium) shares support only LRS or ZRS; geo-redundancy is for HDD shares, so premium profiles reach a second region some other way.
    kind: published
